document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6431ee5b-8d0a-48a0-9779-245afd272b27\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --bg:#0f0a14; --panel:#1a1520; --panel2:#231c2d; --rule:#2a2333;\n  --ink:#f5f0e8; --mute:rgba(245,240,232,.66);\n  --grn:#4fd1c5; --grn-bg:#11262a; --prp:#f687b3; --prp-bg:#2a1723;\n  --tel:#d4a574; --tel-bg:#241c15; --clay:#d97066; --clay-bg:#2a1618;\n  --paper:#1a1520; --pink:#f5f0e8; --pmute:rgba(245,240,232,.66); --prule:rgba(255,255,255,.2);\n  --t-hero:108px; --t-title:72px; --t-sub:44px; --t-lead:36px; --t-body:31px;\n  --t-small:26px; --t-mono:24px; --t-num:200px; --t-stat:150px;\n  --px:110px; --pt:92px; --pb:82px; --g-title:42px; --g-item:22px;\n}\nbody{margin:0;background:#0f0a14}\na{color:var(--tel);text-decoration:none;border-bottom:1px solid rgba(212,165,116,.4)}\na:hover{color:#e3bd93;border-bottom-color:#e3bd93}\n<\u002Fstyle>\n<\u002Fhelmet>\n<x-import component-from-global-scope=\"deck-stage\" from=\"55dad20d-e6c2-4d0b-81cd-67350ed98f7d#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Cover\" data-screen-label=\"01\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:space-between;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)\">\n    <span>Building a personal corpus<\u002Fspan>\n    <span style=\"color:var(--grn)\">Complete deck · four parts<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:36px;max-width:1560px\">\n    <h1 style=\"margin:0;font:500 var(--t-hero)/0.98 'Cormorant Garamond',serif;letter-spacing:-.02em\">Own the model of you.<\u002Fh1>\n    <p style=\"margin:0;font:500 var(--t-sub)/1.3 'Cormorant Garamond',serif;color:var(--mute);max-width:1300px;text-wrap:pretty\">You are already being modeled. This builds that model for you, on your own computer, from your own data, pointed at your own goals.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;gap:56px;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);border-top:1px solid var(--rule);padding-top:32px\">\n    <span>github.com/TaylorONeal/personal-signature<\u002Fspan>\n    <span style=\"color:var(--grn)\">Free, open, runs on your own computer<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"PART 1 · Why\" data-screen-label=\"02\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:34px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Part 1 of four<\u002Fdiv>\n  <h2 style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">Own the model of you.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px;text-wrap:pretty\">What a personal corpus is, why your own trail is the highest-signal data about you, and what it unlocks once you hold it.<\u002Fp>\n  <div style=\"display:flex;gap:16px;margin-top:10px\">\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--grn)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Already modeled\" data-screen-label=\"03\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">The starting condition<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;letter-spacing:-.01em;max-width:1400px\">Every platform you touch already keeps a model of you.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:12px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">SPOTIFY<\u002Fdiv>\n      <div style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">models your taste<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">GOOGLE<\u002Fdiv>\n      <div style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">models your interests<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">META<\u002Fdiv>\n      <div style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">models your relationships<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">AD NETWORKS<\u002Fdiv>\n      <div style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">stitch fragments into a profile<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1400px;text-wrap:pretty\">Those models are good. They are simply not <em style=\"color:var(--ink);font-style:normal;border-bottom:2px solid var(--grn)\">yours<\u002Fem>.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Aimed away\" data-screen-label=\"04\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:44px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">The core claim<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1560px;text-wrap:pretty\">The model of you exists. It is just aimed away from you.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1300px;text-wrap:pretty\">Their objective function is someone else's revenue. They predict what you'll click, what you'll buy, what keeps you scrolling, accurately, and on your behalf only by accident.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Vocabulary\" data-screen-label=\"05\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Vocabulary<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">Four words this whole thing rests on.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:22px 36px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:32px 32px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--ink)\">Your digital trail<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Everything the apps you use have quietly written down, messages sent, songs saved, videos watched, links kept, reviews left.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:32px 32px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">A personal corpus<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">That trail, downloaded and rewritten into one tidy list you own, every entry the same shape, sorted by date, on your own computer.<\u002Fspan>\n      <span style=\"font:400 var(--t-mono)/1.4 ui-monospace,Menlo,monospace;color:rgba(245,240,232,.42)\">\"corpus\" = a body of collected material · here, one file: corpus.db<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:32px 32px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--ink)\">Ingesting<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The step that does the rewriting: it opens one app's messy export file and adds tidy entries to your list. Run it again whenever there's more.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:32px 32px;display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--prp)\">A signature profile<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The written portrait generated from that list: your taste, your interests, how your voice shifts by who you're talking to.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px;text-wrap:pretty\">Nothing here needs an account, and nothing gets uploaded. The list lives in one folder on your machine and never leaves it.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Not the technique\" data-screen-label=\"06\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">The move<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">This flips who owns it, not how it works.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:8px\">\n    <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.35);border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--clay)\">SAME RAW MATERIAL<\u002Fdiv>\n      <p style=\"margin:0;font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">What you listen to, watch, save, write, and where you go.<\u002Fp>\n      <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Sitting in data exports you are legally entitled to download.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--grn)\">OPPOSITE SIDE OF THE LINE<\u002Fdiv>\n      <p style=\"margin:0;font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">One tidy list of your own, on your own computer.<\u002Fp>\n      <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Built for your objective, not someone's ad auction.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">Other companies do this to sell <em style=\"color:var(--ink);font-style:normal\">to<\u002Fem> you. There is no reason the same data can't produce better recommendations, real self-knowledge, and a genuine digital voice, for you.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ I divider\" data-screen-label=\"07\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:var(--prule)\">I<\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">The raw material<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--pmute)\">Why your own trail is the best data there is<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Digital exhaust\" data-screen-label=\"08\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">What goes in<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">Your trail is already yours to download.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px 40px;margin-top:4px\">\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Email<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Gmail Sent mbox, API threads<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">SMS &amp; DMs<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">iMessage, Instagram, Messenger, WhatsApp<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Chat<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Google Chat, Google Voice, Slack<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Bookmarks<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Browser HTML export, saved links<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Likes &amp; saves<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Spotify liked, Reddit saved, Goodreads<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Watch history<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">YouTube, Netflix<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Published output<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">X archive, Yelp reviews, blog<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Places<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Reviews, orders, travel, visits<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Anything tabular<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Generic csv / jsonl with a column map<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px\">You don't need every source. The system is built to work with whatever subset you have, and to tell you, honestly, what's thin.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Sources fan-in\" data-screen-label=\"09\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:26px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Many apps, three kinds, one list.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">How sources land<\u002Fspan>\n  <\u002Fdiv>\n  <div data-om-raster=\"true\" style=\"flex:1;min-height:0;display:grid;grid-template-columns:1.1fr 60px 1fr 60px .95fr;align-items:center\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n      <div style=\"border:1px solid rgba(246,135,179,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">iMessage<\u002Fdiv>\n      <div style=\"border:1px solid rgba(246,135,179,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Google Messages<\u002Fdiv>\n      <div style=\"border:1px solid rgba(246,135,179,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Gmail<\u002Fdiv>\n      <div style=\"border:1px solid rgba(246,135,179,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">LinkedIn DMs<\u002Fdiv>\n      <div style=\"border:1px solid rgba(246,135,179,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Instagram DMs<\u002Fdiv>\n      <div style=\"border:1px solid rgba(246,135,179,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">WhatsApp<\u002Fdiv>\n      <div style=\"border:1px solid rgba(79,209,197,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Calendar<\u002Fdiv>\n      <div style=\"border:1px solid rgba(79,209,197,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Spotify<\u002Fdiv>\n      <div style=\"border:1px solid rgba(79,209,197,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">YouTube<\u002Fdiv>\n      <div style=\"border:1px solid rgba(79,209,197,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Bookmarks<\u002Fdiv>\n      <div style=\"border:1px solid rgba(212,165,116,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">Substack<\u002Fdiv>\n      <div style=\"border:1px solid rgba(212,165,116,.4);border-radius:10px;padding:15px 18px;font:400 var(--t-small)/1.15 'DM Sans',sans-serif\">LinkedIn posts<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:64%;display:flex;align-items:center;justify-content:center\"><div style=\"width:1px;height:100%;background:var(--rule)\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"background:rgba(246,135,179,.1);border:1px solid rgba(246,135,179,.45);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--prp)\">Messages, both ways<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--mute)\">your voice, and who you speak to<\u002Fspan><\u002Fdiv>\n      <div style=\"background:rgba(79,209,197,.1);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--grn)\">What you took in<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--mute)\">taste, attention, where your time went<\u002Fspan><\u002Fdiv>\n      <div style=\"background:rgba(212,165,116,.1);border:1px solid rgba(212,165,116,.45);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--tel)\">What you put out publicly<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--mute)\">your public register<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:64%;display:flex;align-items:center;justify-content:center\"><div style=\"width:1px;height:100%;background:var(--rule)\"><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.5);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">Your personal corpus<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">One entry per thing that happened, every entry the same six fields, sorted by date.<\u002Fspan>\n      <span style=\"font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace;color:rgba(245,240,232,.45);border-top:1px solid rgba(79,209,197,.3);padding-top:16px\">106,230 entries<br>2016 to today<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1550px;flex:none\">Start with two apps or twelve. The kind an app belongs to is what decides which part of the portrait it feeds.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Behavioral\" data-screen-label=\"10\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:30px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Property 01 / 05<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Behavioral, not declared.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">A questionnaire records what you <em style=\"color:var(--ink);font-style:normal\">say<\u002Fem> you like. Your library, your watch history, and your sent folder record what you actually <em style=\"color:var(--ink);font-style:normal\">did<\u002Fem>.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Revealed preference beats stated preference every time.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.1em\">STATED<\u002Fdiv>\n      <div style=\"font:300 var(--t-lead)/1.3 'Cormorant Garamond',serif;color:var(--mute)\">\"I mostly listen to jazz.\"<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:14px;padding:34px 36px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">REVEALED · 4,812 SAVES<\u002Fdiv>\n      <div style=\"font:300 var(--t-lead)/1.3 'Cormorant Garamond',serif;color:var(--ink)\">Melodic techno, 61% of saves since 2019.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Longitudinal\" data-screen-label=\"11\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Property 02 / 05<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Longitudinal, not a snapshot.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1350px;text-wrap:pretty\">Years of it. That is what lets the system see eras, drift, and how you changed, instead of only where you are today.<\u002Fp>\n  <div style=\"display:flex;align-items:flex-end;gap:14px;height:300px;margin-top:10px\" data-om-raster=\"true\">\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--grn) 0%,rgba(79,209,197,.25) 100%);height:34%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--grn) 0%,rgba(79,209,197,.25) 100%);height:52%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--grn) 0%,rgba(79,209,197,.25) 100%);height:71%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--prp) 0%,rgba(246,135,179,.25) 100%);height:96%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--grn) 0%,rgba(79,209,197,.25) 100%);height:64%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--grn) 0%,rgba(79,209,197,.25) 100%);height:41%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--grn) 0%,rgba(79,209,197,.25) 100%);height:58%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n    <div style=\"flex:1;background:linear-gradient(180deg,var(--tel) 0%,rgba(212,165,116,.25) 100%);height:83%;border-radius:6px 6px 0 0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:22px;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute)\">\n    <span>how much you sent and saved, month by month<\u002Fspan>\n    <span style=\"color:var(--prp)\">the peaks and the quiet stretches are the findings<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Own words\" data-screen-label=\"12\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:40px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Property 03 / 05<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">In your own words.<\u002Fh2>\n  <p style=\"margin:0;font:500 var(--t-sub)/1.35 'Cormorant Garamond',serif;color:var(--ink);max-width:1450px;text-wrap:pretty\">Your sent messages and posts are the only large body of text that is unambiguously your voice, in real contexts, to real people, with real stakes.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1350px\">That is what makes a credible Communication Signature possible at all. Not a style guess: a register map built from lines you actually wrote.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"First-party\" data-screen-label=\"13\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:30px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Property 04 / 05<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">First-party and complete.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Ad networks reconstruct you from fragments seen through tracking. You have the whole thing, from the inside, with ground truth on who each contact is and which words are yours.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"display:flex;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:28px 32px\">\n      <span style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.08em;min-width:230px\">THIRD-PARTY VIEW<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">inferred · partial · probabilistic<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:20px;align-items:center;background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:14px;padding:28px 32px\">\n      <span style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em;min-width:230px\">YOUR VIEW<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--ink)\">ground truth on identity, direction, and thread<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">You list your own phone numbers, emails, and usernames once. After that the system can tell your words from everyone else's, which is what makes a voice portrait possible at all. <span style=\"font-family:ui-monospace,Menlo,monospace;color:rgba(245,240,232,.42)\">saved as identity.json<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Unperformed\" data-screen-label=\"14\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:40px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Property 05 / 05<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Unperformed.<\u002Fh2>\n  <p style=\"margin:0;font:500 var(--t-sub)/1.35 'Cormorant Garamond',serif;max-width:1500px;text-wrap:pretty\">The 2 a.m. text, the playlist you'd never share, the search you'd never post. The realest signal is exactly the material that never makes it into a public persona.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1350px\">Which is also why it stays on your machine. See the privacy section.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Downloadable training set\" data-screen-label=\"15\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:44px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">The short version<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1600px;text-wrap:pretty\">The most valuable training set about you in the world is one you can already download.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1300px\">This is the toolkit for using it yourself.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ II divider\" data-screen-label=\"16\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:var(--prule)\">II<\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">Flipping the ownership<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--pmute)\">Same data, opposite owner<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Fork diagram\" data-screen-label=\"17\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:34px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The same raw signal forks two ways.<\u002Fh2>\n  <div data-om-raster=\"true\" style=\"flex:1;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"display:flex;gap:18px\">\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:20px 0;text-align:center;font:400 var(--t-small)/1 'DM Sans',sans-serif\">messages you write<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:20px 0;text-align:center;font:400 var(--t-small)/1 'DM Sans',sans-serif\">music &amp; shows you save<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:20px 0;text-align:center;font:400 var(--t-small)/1 'DM Sans',sans-serif\">links &amp; places you keep<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:20px 0;text-align:center;font:400 var(--t-small)/1 'DM Sans',sans-serif\">things you publish<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute)\">▼ &nbsp; the same behavioral signal &nbsp; ▼<\u002Fdiv>\n    <div style=\"flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px\">\n      <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.35);border-radius:16px;padding:38px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--clay)\">Their model of you<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">built to predict what you'll buy<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--ink)\">Assembled from tracking fragments, held on their servers, tuned against an engagement metric you never see.<\u002Fdiv>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:rgba(217,112,102,.12);border-radius:100px;padding:16px 0;text-align:center;font:500 var(--t-small)/1 'DM Sans',sans-serif;color:var(--clay)\">ads · nudges · the feed<\u002Fdiv>\n          <div style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">fragmented · third-party · optimizes theirs<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:16px;padding:38px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">Your personal corpus, on your computer<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">one tidy list · yours · the complete picture<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--ink)\">One normalized table of everything you did, with ground truth on direction, contact, and thread, queryable by you.<\u002Fdiv>\n        <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;gap:12px\">\n            <div style=\"flex:1;background:rgba(79,209,197,.14);border-radius:10px;padding:16px 8px;text-align:center;font:500 var(--t-mono)/1.2 ui-monospace,Menlo,monospace;color:var(--grn)\">Content Profile<\u002Fdiv>\n            <div style=\"flex:1;background:rgba(246,135,179,.16);border-radius:10px;padding:16px 8px;text-align:center;font:500 var(--t-mono)/1.2 ui-monospace,Menlo,monospace;color:var(--prp)\">Comm. Signature<\u002Fdiv>\n            <div style=\"flex:.7;background:rgba(212,165,116,.16);border-radius:10px;padding:16px 8px;text-align:center;font:500 var(--t-mono)/1.2 ui-monospace,Menlo,monospace;color:var(--tel)\">your apps<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">complete · first-party · optimizes yours<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What changes\" data-screen-label=\"18\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">When the objective is yours<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four things become possible.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:6px\">\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:36px 34px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">01<\u002Fdiv>\n      <div style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Recommendations that serve you<\u002Fdiv>\n      <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Surfaced because they fit your taste, not because they maximize an engagement metric.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:36px 34px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">02<\u002Fdiv>\n      <div style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Insight from outside your own head<\u002Fdiv>\n      <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">How relationships actually trend, how interests shifted over a decade, what you keep returning to.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:36px 34px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">03<\u002Fdiv>\n      <div style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">An AI that sounds like you<\u002Fdiv>\n      <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A drop-in voice block built from real sent messages, so any model writes in your register instead of assistant beige.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:36px 34px;display:flex;flex-direction:column;gap:14px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">04<\u002Fdiv>\n      <div style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">A foundation for whatever comes next<\u002Fdiv>\n      <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Any tool you build later can read the list and ask it questions, the personal context a general-purpose AI has no way to get.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Local is the premise\" data-screen-label=\"19\" style=\"background:var(--grn-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:40px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Non-negotiable<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1560px;text-wrap:pretty\">This only works because it's local.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px;text-wrap:pretty\">The whole premise, owning the model instead of renting it from a platform, falls apart the moment the data leaves your machine. No cloud, no telemetry, no exceptions.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ III divider\" data-screen-label=\"20\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:var(--prule)\">III<\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">From history to memory<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--pmute)\">Structured · auditable · re-runnable<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Exhaust to memory\" data-screen-label=\"21\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">A scattered trail becomes memory you can search.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1400px\">Four steps, and each one hands the next one nothing but the list. Stop wherever you like, a source you never got never breaks anything downstream.<\u002Fp>\n  <div data-om-raster=\"true\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px\">\n    <div style=\"display:flex;align-items:stretch;gap:16px\">\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Acquire<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">request exports<\u002Fspan><\u002Fdiv>\n      <div style=\"align-self:center;color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Collect<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">watch inbox, download<\u002Fspan><\u002Fdiv>\n      <div style=\"align-self:center;color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Ingest<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">parse + store<\u002Fspan><\u002Fdiv>\n      <div style=\"align-self:center;color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1.2;background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif;color:var(--grn)\">Your personal corpus<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">entries · people · sources<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;padding-left:6px\">\n      <div style=\"flex:1;border:1px dashed var(--rule);border-radius:14px;padding:24px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--ink)\">What you took in<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:rgba(245,240,232,.45)\">signal_in<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;border:1px dashed var(--rule);border-radius:14px;padding:24px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--ink)\">Messages, both directions<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:rgba(245,240,232,.45)\">communication<\u002Fspan><\u002Fdiv>\n      <div style=\"flex:1;border:1px dashed var(--rule);border-radius:14px;padding:24px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--ink)\">What you put out publicly<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:rgba(245,240,232,.45)\">published<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px\">\n      <div style=\"flex:1;background:rgba(79,209,197,.1);border:1px solid rgba(79,209,197,.4);border-radius:14px;padding:26px;font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--grn)\">Content Profile<\u002Fdiv>\n      <div style=\"flex:1;background:rgba(246,135,179,.12);border:1px solid rgba(246,135,179,.4);border-radius:14px;padding:26px;font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--prp)\">Communication Signature<\u002Fdiv>\n      <div style=\"flex:1;background:rgba(212,165,116,.1);border:1px solid rgba(212,165,116,.4);border-radius:14px;padding:26px;font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--tel)\">anything else you build<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What a corpus is\" data-screen-label=\"22\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Inside the import<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1500px\">Six messy files in, one tidy list out.<\u002Fh2>\n  <div data-om-raster=\"true\" style=\"flex:1;display:grid;grid-template-columns:1fr auto 1.25fr;gap:40px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--clay)\">WHAT YOU DOWNLOAD<\u002Fdiv>\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 26px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;color:var(--mute)\">chat.db<br><span style=\"color:rgba(245,240,232,.4)\">a 4 GB SQLite file, 40 tables<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 26px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;color:var(--mute)\">instagram/messages/inbox/<br><span style=\"color:rgba(245,240,232,.4)\">1,900 folders of nested JSON<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 26px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;color:var(--mute)\">watch-history.html<br><span style=\"color:rgba(245,240,232,.4)\">180 MB of one giant page<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 26px;font:400 var(--t-mono)/1.35 ui-monospace,Menlo,monospace;color:var(--mute)\">liked.csv · Sent.mbox · bookmarks.html<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px\">\n      <div style=\"font:400 60px/1 ui-monospace,Menlo,monospace;color:var(--tel)\">→<\u002Fdiv>\n      <div style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--tel);text-align:center;max-width:190px\">ingesting<br>reads each one<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:16px;padding:34px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--grn)\">WHAT YOU GET · YOUR PERSONAL CORPUS<\u002Fdiv>\n      <div style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">One table. One row per thing that happened. Same six columns whether the row is a text message, a saved song, or a restaurant review.<\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(79,209,197,.3);padding-top:20px;font:400 var(--t-mono)/1.6 ui-monospace,Menlo,monospace;color:var(--mute)\">when · what kind · who · which way<br>the text · where it came from<\u002Fdiv>\n      <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">That sameness is the whole trick: once everything is one shape, a decade of six platforms can be sorted, counted, and searched together.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Message to record\" data-screen-label=\"23\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">One text message, before and after ingesting.<\u002Fh2>\n  <div data-om-raster=\"true\" style=\"flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:36px;align-items:center\">\n    <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:34px 32px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--clay)\">BEFORE · how Apple stores it<\u002Fdiv>\n      <div style=\"font:400 var(--t-mono)/1.65 ui-monospace,Menlo,monospace;color:var(--mute)\">ROWID: 448201<br>is_from_me: 1<br>date: 681455223000000000<br>handle_id: 3391<br>text: NULL<br><span style=\"color:var(--clay)\">attributedBody: &lt;binary blob&gt;<\u002Fspan><br>cache_roomnames: NULL<br>service: iMessage<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--rule);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:rgba(245,240,232,.5)\">Apple epoch nanoseconds. Contact behind a join. On modern macOS the text isn't even in the text column.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px\">\n      <div style=\"font:400 60px/1 ui-monospace,Menlo,monospace;color:var(--tel)\">→<\u002Fdiv>\n      <div style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--tel);text-align:center;max-width:210px\">ingesting, using<br>your list of handles<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:16px;padding:34px 32px;display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--grn)\">AFTER · one entry in your corpus<\u002Fdiv>\n      <div style=\"font:400 var(--t-mono)/1.65 ui-monospace,Menlo,monospace;color:var(--ink)\">ts: <span style=\"color:var(--mute)\">2022-08-06T23:41:12Z<\u002Fspan><br>bucket: <span style=\"color:var(--prp)\">communication<\u002Fspan><br>source: <span style=\"color:var(--mute)\">imessage<\u002Fspan><br>direction: <span style=\"color:var(--grn)\">sent<\u002Fspan><br>contact: <span style=\"color:var(--mute)\">Maya (+1512…0144)<\u002Fspan><br>body: <span style=\"color:var(--mute)\">\"still up if you want to…\"<\u002Fspan><br>external_id: <span style=\"color:var(--mute)\">imsg:448201<\u002Fspan><\u002Fdiv>\n      <div style=\"border-top:1px solid rgba(79,209,197,.3);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">A real date. A person's name. And a direction, the sender matched one of your own handles, so this line counts as your voice, not someone else's.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Same shape\" data-screen-label=\"24\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four different apps, one entry shape.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;flex:1;justify-content:center\">\n    <div style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr .8fr 1.5fr;gap:28px;padding:0 8px 16px;border-bottom:1px solid var(--prule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--mute)\"><span>WHAT HAPPENED<\u002Fspan><span>WHICH APP<\u002Fspan><span>WHICH KIND<\u002Fspan><span>WHICH WAY<\u002Fspan><span>THE TEXT<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr .8fr 1.5fr;gap:28px;padding:26px 8px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif;align-items:baseline\"><span>You texted a friend<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">imessage<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">communication<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">sent<\u002Fspan><span style=\"color:var(--mute)\">\"still up if you want to…\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr .8fr 1.5fr;gap:28px;padding:26px 8px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif;align-items:baseline\"><span>You saved a track<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">spotify_liked<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">signal_in<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">liked<\u002Fspan><span style=\"color:var(--mute)\">Ben Böhmer · Beyond Beliefs<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr .8fr 1.5fr;gap:28px;padding:26px 8px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif;align-items:baseline\"><span>You bookmarked a link<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">bookmarks<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">signal_in<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">bookmarked<\u002Fspan><span style=\"color:var(--mute)\">\"SQLite as an application file format\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.25fr .9fr .95fr .8fr 1.5fr;gap:28px;padding:26px 8px;font:400 var(--t-small)/1.35 'DM Sans',sans-serif;align-items:baseline\"><span>You posted a review<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">yelp<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">published<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">posted<\u002Fspan><span style=\"color:var(--mute)\">\"Four stars, and only because the…\"<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1550px;text-wrap:pretty\">Nothing here is clever. It is just consistent, and consistency is what lets one question reach across all four rows at once.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"On disk\" data-screen-label=\"25\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1.05fr 1fr;gap:60px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:40px 38px;font:400 var(--t-mono)/1.72 ui-monospace,Menlo,monospace;color:var(--mute)\">\n    <div style=\"color:var(--tel)\">exports/<\u002Fdiv>\n    <div>&nbsp;&nbsp;chat.db<span style=\"color:rgba(245,240,232,.35)\">&nbsp;&nbsp;&nbsp;&nbsp;iMessage, copied<\u002Fspan><\u002Fdiv>\n    <div>&nbsp;&nbsp;instagram/<span style=\"color:rgba(245,240,232,.35)\">&nbsp;&nbsp;still zipped<\u002Fspan><\u002Fdiv>\n    <div>&nbsp;&nbsp;linkedin/<\u002Fdiv>\n    <div>&nbsp;&nbsp;Sent.mbox<\u002Fdiv>\n    <div>&nbsp;&nbsp;liked.csv<\u002Fdiv>\n    <div style=\"color:rgba(245,240,232,.35)\">&nbsp;&nbsp;_manifest.json&nbsp;&nbsp;what you're still waiting on<\u002Fdiv>\n    <div style=\"margin-top:14px;color:var(--tel)\">engine/<\u002Fdiv>\n    <div>&nbsp;&nbsp;schema.sql&nbsp;&nbsp;corpus.py<\u002Fdiv>\n    <div>&nbsp;&nbsp;parsers/&nbsp;&nbsp;run_ingest.py<\u002Fdiv>\n    <div>&nbsp;&nbsp;query.py&nbsp;&nbsp;coverage.py<\u002Fdiv>\n    <div style=\"margin-top:14px;color:var(--prp)\">identity.json<span style=\"color:rgba(245,240,232,.35)\">&nbsp;&nbsp;your own numbers and usernames<\u002Fspan><\u002Fdiv>\n    <div style=\"margin-top:14px;color:var(--grn)\">corpus.db<span style=\"color:rgba(245,240,232,.35)\">&nbsp;&nbsp;&nbsp;your corpus · never uploaded, never shared<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">What it looks like in a folder<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Three folders and two files.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">The archives you downloaded stay exactly as they arrived, they are your backup of last resort. The code reads them; your corpus is the output. Delete it and you can rebuild it in an afternoon.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--ink)\">Nothing else is required. No server, no account, no folder anywhere but this one.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What the shape buys\" data-screen-label=\"26\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Why one shape matters<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1500px\">Questions no single platform can answer.<\u002Fh2>\n  <div style=\"display:grid;grid-template-col
