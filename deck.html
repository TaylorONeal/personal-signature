u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">How the voice changes across texting, email, and public writing, sampled per context from your own words.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:38px 32px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">03<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Relationship dynamics<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Who initiates, sent-to-received balance, durable versus ended bonds, how they started and how they closed.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Voice block\" data-screen-label=\"56\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.15fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">voice-signature.md<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The voice block.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Paste it into any model's system prompt and the output stops sounding like an assistant. Every trait traces to a real line in the corpus, so it can be checked rather than trusted.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Starting point: <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">python engine/query.py voice-sample<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative;height:100%;border:1px solid var(--rule);border-radius:16px;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:20px 30px;border-bottom:1px solid var(--rule);background:#120d18\">\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--clay)\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--tel)\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--grn)\"><\u002Fspan>\n        <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);margin-left:12px\">voice-signature.md<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:32px 38px;display:flex;flex-direction:column;gap:20px;overflow:hidden\">\n        <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">## Write as Jordan<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--ink)\">Long paragraphs in public, short lines in private. Concrete nouns over abstractions. Open on a scene, never a thesis. No exclamation points anywhere, in ten years.<\u002Fdiv>\n        <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);margin-top:4px\">## Register map<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:12px 26px;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">\n          <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">iMessage<\u002Fspan><span>7 words median · lowercase · \"yep\" as agreement<\u002Fspan>\n          <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">email<\u002Fspan><span>2 paragraphs · leads with the ask · signs off \"- J\"<\u002Fspan>\n          <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">Substack<\u002Fspan><span>1,400 words median · semicolons · closes on a question<\u002Fspan>\n          <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--clay)\">work chat<\u002Fspan><span>pending, never exported<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);margin-top:4px\">## Tells, with evidence<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">· opens on a scene &nbsp;<span style=\"color:rgba(245,240,232,.42)\">→ \"The bus was late again, which is how I…\"<\u002Fspan><br>· hedges in private, commits in public &nbsp;<span style=\"color:rgba(245,240,232,.42)\">→ \"maybe? idk\" vs \"This is the part everyone gets wrong.\"<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:auto;border-top:1px solid var(--rule);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Every trait cites a real line, drawn from 214 essays and 38,904 sent messages. Paste this into any model's system prompt.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Cross-checks\" data-screen-label=\"57\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:42px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Why two portraits, not one<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1560px;text-wrap:pretty\">Inputs and outputs cross-check each other.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1450px;text-wrap:pretty\">The Content Profile is what you take in; the Communication Signature is what you put out. Merged into one portrait, the disagreements disappear, and the disagreements are usually the finding.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ III divider\" data-screen-label=\"58\" style=\"background:var(--tel-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(212,165,116,.32)\">III<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--tel);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">The substrate<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--tel)\">corpus.db · the part you build on<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Context layer\" data-screen-label=\"59\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">The third output<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">The personal-context layer generic AI is missing.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">Underneath both portraits: one normalized table of everything, with full-text search and ready-made read helpers.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:6px\">\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.4);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">A recommender<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">reads signal_in<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.4);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">A \"what was I into in 2019\" agent<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">reads the timeline<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.4);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">A journal summarizer<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">reads communication<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.4);border-radius:14px;padding:32px 28px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">A write-as-me drafter<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">reads your sent items<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">All four read the same local store. The DB lands at <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">corpus.db<\u002Fspan> in the repo root, git-ignored, never committed.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Data model\" data-screen-label=\"60\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">schema.sql<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Three tables.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:26px;margin-top:6px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-lead)/1.1 ui-monospace,Menlo,monospace;color:var(--tel)\">items<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The spine. One row per atomic thing: a message, post, like, ride, review. Every row carries a bucket.<\u002Fspan>\n      <span style=\"font:400 var(--t-mono)/1.6 ui-monospace,Menlo,monospace;color:var(--ink);border-top:1px solid var(--rule);padding-top:18px\">bucket · source · direction<br>ts · external_id · thread_id<br>title · body · url · rating<br>lat · lon · meta<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-lead)/1.1 ui-monospace,Menlo,monospace;color:var(--tel)\">contacts<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The other parties, deduped by normalized handle, with optional relationship and status labels.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-lead)/1.1 ui-monospace,Menlo,monospace;color:var(--tel)\">sources<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A hint registry. Sources auto-register on first ingest, and hold the per-source timestamp watermark.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px;text-wrap:pretty\">One flat items table instead of per-source tables: synthesis stays source-agnostic, and partial coverage becomes a non-event rather than a special case.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Buckets table\" data-screen-label=\"61\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">The data model maps to the goals<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Buckets decide which portrait an item feeds.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;margin-top:6px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:30px;padding:0 12px 20px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\">\n      <span>BUCKET<\u002Fspan><span>MEANING<\u002Fspan><span>FEEDS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:30px;padding:32px 12px;border-bottom:1px solid var(--rule);align-items:baseline\">\n      <span style=\"font:500 var(--t-lead)/1.2 ui-monospace,Menlo,monospace;color:var(--grn)\">signal_in<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Things you consumed, likes, plays, watches, bookmarks, ratings, visits<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Content Profile<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:30px;padding:32px 12px;border-bottom:1px solid var(--rule);align-items:baseline\">\n      <span style=\"font:500 var(--t-lead)/1.2 ui-monospace,Menlo,monospace;color:var(--prp)\">communication<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Messages, both directions<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Communication Signature<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:30px;padding:32px 12px;border-bottom:1px solid var(--rule);align-items:baseline\">\n      <span style=\"font:500 var(--t-lead)/1.2 ui-monospace,Menlo,monospace;color:var(--ink)\">published<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Your public or long-form output, posts, reviews, tweets, blog<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Both: voice to the Signature, topics to the Profile<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Three buckets is enough to drive the three synthesis dimensions, relationships, voice, interests, and keeps every query simple.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Identity\" data-screen-label=\"62\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">identity.json<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Identity is what makes direction knowable.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">If a message's sender matches one of your handles, the item is <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">out<\u002Fspan> / <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">sent<\u002Fspan> / <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">posted<\u002Fspan>. Otherwise it's <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">in<\u002Fspan> / <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">received<\u002Fspan>.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--ink)\">Without it there is no voice block and no sent-to-received ratio. It is the first thing you fill in.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:40px 38px;font:400 var(--t-mono)/1.7 ui-monospace,Menlo,monospace;color:var(--ink)\">\n    <div style=\"color:var(--mute)\">$ cp identity.example.json identity.json<\u002Fdiv>\n    <div style=\"margin-top:20px;color:var(--tel)\">{<\u002Fdiv>\n    <div>&nbsp;&nbsp;\"name\": \"Your Name\",<\u002Fdiv>\n    <div>&nbsp;&nbsp;\"emails\": [\"you@gmail.com\"],<\u002Fdiv>\n    <div>&nbsp;&nbsp;\"phones\": [\"+15125550100\"],<\u002Fdiv>\n    <div>&nbsp;&nbsp;\"handles\": [\"yourhandle\"]<\u002Fdiv>\n    <div style=\"color:var(--tel)\">}<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Dedup\" data-screen-label=\"63\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">Idempotency<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Re-ingest is always safe.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:6px\">\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">PRIMARY<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">external_id<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Used whenever the platform provides one.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">FALLBACK<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">content hash<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Hash of source, direction, ts, contact, and the first 300 characters of the body.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">CROSS-SOURCE<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">collapse duplicates<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">An SMS that also appears in Google Voice collapses on direction, contact, and normalized body within a time window.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px\">Run it twice, run it wrong, run it again next month, the counts stay honest.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Dedup visualized\" data-screen-label=\"64\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The same text message, arriving twice.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1500px\">An SMS shows up in the iMessage database and again in the Google Voice export. Two files, two formats, one event.<\u002Fp>\n  <div data-om-raster=\"true\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px\">\n      <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">exports/chat.db<\u002Fspan>\n        <span style=\"font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace;color:var(--mute)\">sent · +15125550144 · 23:41:12<br>\"heading out in ten\"<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">exports/linkedin/Calls/…html<\u002Fspan>\n        <span style=\"font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace;color:var(--mute)\">Me to (512) 555-0144 · 11:41 PM<br>\"Heading out in ten.\"<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;justify-content:center\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">MATCH ON<\u002Fspan>\n      <span style=\"border:1px solid rgba(212,165,116,.5);border-radius:100px;padding:14px 26px;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel)\">direction<\u002Fspan>\n      <span style=\"border:1px solid rgba(212,165,116,.5);border-radius:100px;padding:14px 26px;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel)\">normalized contact<\u002Fspan>\n      <span style=\"border:1px solid rgba(212,165,116,.5);border-radius:100px;padding:14px 26px;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel)\">normalized body<\u002Fspan>\n      <span style=\"border:1px solid rgba(212,165,116,.5);border-radius:100px;padding:14px 26px;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel)\">time window<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"text-align:center;font:400 40px/1 ui-monospace,Menlo,monospace;color:var(--tel)\">↓<\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:16px;padding:30px 34px;display:flex;align-items:center;gap:34px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">ONE ROW KEPT<\u002Fspan>\n      <span style=\"font:400 var(--t-mono)/1.4 ui-monospace,Menlo,monospace;color:var(--ink)\">imessage · sent · Maya · 2026-08-14T23:41:12Z · \"heading out in ten\"<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1550px\">Without this, every sent-to-received ratio in the profile would be quietly wrong, inflated by whichever platform you happened to export twice.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Delta mode\" data-screen-label=\"65\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">--mode delta<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Two modes: build it, then keep it fresh.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Initial runs parse everything and lean on dedup. Delta runs add only items newer than the stored per-source watermark, so refreshing a source takes seconds instead of re-parsing years.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A full re-run is always safe too, just slower.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:34px 32px;font:400 var(--t-mono)/1.7 ui-monospace,Menlo,monospace;color:var(--ink)\">\n      <div style=\"color:var(--mute)\"># initial, parse everything<\u002Fdiv>\n      <div>run_ingest.py imessage exports/chat.db<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#120d18;border:1px solid rgba(212,165,116,.4);border-radius:16px;padding:34px 32px;font:400 var(--t-mono)/1.7 ui-monospace,Menlo,monospace;color:var(--ink)\">\n      <div style=\"color:var(--mute)\"># ongoing, only what's new<\u002Fdiv>\n      <div>run_ingest.py imessage exports/chat.db <span style=\"color:var(--tel)\">--mode delta<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Back up first: <span style=\"font-family:ui-monospace,Menlo,monospace\">cp corpus.db corpus.db.bak-$(date +%F-%H%M)<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"query.py\" data-screen-label=\"66\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">engine/query.py<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Five read helpers, straight out of the box.<\u002Fh2>\n  <div style=\"flex:1;min-height:0;background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:44px 42px;display:flex;flex-direction:column;justify-content:center;gap:24px;font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace\">\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:baseline\"><span style=\"color:var(--tel)\">query.py stats<\u002Fspan><span style=\"color:var(--mute)\">counts by bucket and source, plus the date range<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:baseline\"><span style=\"color:var(--tel)\">query.py top-contacts<\u002Fspan><span style=\"color:var(--mute)\">who you talk to most, with sent-to-received balance<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:baseline\"><span style=\"color:var(--tel)\">query.py voice-sample<\u002Fspan><span style=\"color:var(--mute)\">your own words, per register, for a voice block<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:baseline\"><span style=\"color:var(--tel)\">query.py interests<\u002Fspan><span style=\"color:var(--mute)\">what you point attention at<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:baseline\"><span style=\"color:var(--tel)\">query.py search \"…\"<\u002Fspan><span style=\"color:var(--mute)\">full-text search across everything<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"coverage.py\" data-screen-label=\"67\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Coverage: what you have, and what's thin.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">engine/coverage.py<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:0;position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background:#120d18;padding:36px 44px;display:flex;flex-direction:column;gap:18px;font:400 var(--t-mono)/1.55 ui-monospace,Menlo,monospace;overflow:hidden\">\n      <div style=\"color:var(--mute)\">$ python engine/coverage.py<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr .8fr .8fr 1.6fr;gap:30px;color:rgba(245,240,232,.45);border-bottom:1px solid var(--rule);padding-bottom:12px\">\n        <span>BUCKET<\u002Fspan><span>ITEMS<\u002Fspan><span>SOURCES<\u002Fspan><span>RANGE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr .8fr .8fr 1.6fr;gap:30px;color:var(--grn)\"><span>signal_in<\u002Fspan><span>24,880<\u002Fspan><span>5<\u002Fspan><span>2016-04 → 2026-08<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr .8fr .8fr 1.6fr;gap:30px;color:var(--prp)\"><span>communication<\u002Fspan><span>78,410<\u002Fspan><span>4<\u002Fspan><span>2016-01 → 2026-08<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.1fr .8fr .8fr 1.6fr;gap:30px;color:var(--ink)\"><span>published<\u002Fspan><span>2,940<\u002Fspan><span>2<\u002Fspan><span>2018-09 → 2026-08<\u002Fspan><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--rule);padding-top:16px;color:var(--tel)\">strong&nbsp;&nbsp;public voice · 214 long-form pieces<\u002Fdiv>\n      <div style=\"color:var(--clay)\">thin&nbsp;&nbsp;work register · no work-chat export<\u002Fdiv>\n      <div style=\"color:var(--clay)\">thin&nbsp;&nbsp;places &amp; travel · no source ingested<\u002Fdiv>\n      <div style=\"color:var(--mute)\">watermarks&nbsp;&nbsp;imessage 2026-08-14 · substack 2026-08-11<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Shown after every ingest, and read first by profile and analyze, it is the contract between what exists and what may be claimed.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ IV divider\" data-screen-label=\"68\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:var(--prule)\">IV<\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">Sources &amp; extension<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--pmute)\">Sixteen parsers, one contract<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Sources: comms\" data-screen-label=\"69\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Supported sources: communication.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--prp)\">Feeds the Signature<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:0 10px 16px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>SOURCE<\u002Fspan><span>KIND<\u002Fspan><span>WHAT IT CONTRIBUTES<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>iMessage (chat.db)<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">imessage<\u002Fspan><span style=\"color:var(--mute)\">private voice, closest bonds<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Gmail (Sent mbox)<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">mbox<\u002Fspan><span style=\"color:var(--mute)\">long-form written register<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Gmail (API threads JSON)<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">gmailjson<\u002Fspan><span style=\"color:var(--mute)\">threaded email, both directions<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Instagram DMs<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">instagram<\u002Fspan><span style=\"color:var(--mute)\">casual register, newer bonds<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Facebook Messenger<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">facebook<\u002Fspan><span style=\"color:var(--mute)\">older eras, lapsed contacts<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Google Chat / Hangouts<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">googlechat<\u002Fspan><span style=\"color:var(--mute)\">work-adjacent register<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Google Voice<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">googlevoice<\u002Fspan><span style=\"color:var(--mute)\">SMS overlap, dedupe against iMessage<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>WhatsApp (chat export)<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">whatsapp<\u002Fspan><span style=\"color:var(--mute)\">international and travel contacts<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>WhatsApp (iPhone backup)<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">whatsapp_ios<\u002Fspan><span style=\"color:var(--mute)\">full history from ChatStorage.sqlite<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:30px;padding:20px 10px;font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Slack<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">slack<\u002Fspan><span style=\"color:var(--mute)\">professional register<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Sources: content\" data-screen-label=\"70\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Supported sources: signal in and published.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--grn)\">Feeds the Content Profile<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:0 10px 16px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>SOURCE<\u002Fspan><span>KIND<\u002Fspan><span>BUCKET<\u002Fspan><span>GOAL<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>YouTube watch history<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">youtube<\u002Fspan><span style=\"color:var(--mute)\">signal_in<\u002Fspan><span>Content Profile<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Netflix<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">netflix<\u002Fspan><span style=\"color:var(--mute)\">signal_in<\u002Fspan><span>Content Profile<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Spotify liked<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">csv<\u002Fspan><span style=\"color:var(--mute)\">signal_in<\u002Fspan><span>Content Profile<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Browser bookmarks<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">bookmarks<\u002Fspan><span style=\"color:var(--mute)\">signal_in<\u002Fspan><span>Content Profile<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>X / Twitter archive<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">twitter<\u002Fspan><span style=\"color:var(--mute)\">published<\u002Fspan><span>Both<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Yelp reviews<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">yelp<\u002Fspan><span style=\"color:var(--mute)\">published<\u002Fspan><span>Both<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Blog / long-form<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">mbox · jsonl<\u002Fspan><span style=\"color:var(--mute)\">published<\u002Fspan><span>Both<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px;padding:24px 10px;font:400 var(--t-small)/1.35 'DM Sans',sans-serif\"><span>Anything tabular<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--tel)\">csv · jsonl<\u002Fspan><span style=\"color:var(--mute)\">any<\u002Fspan><span>Depends on the map<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The generic kinds take <span style=\"font-family:ui-monospace,Menlo,monospace\">--source<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace\">--bucket<\u002Fspan>, <span style=\"font-family:ui-monospace,Menlo,monospace\">--direction<\u002Fspan>, and a <span style=\"font-family:ui-monospace,Menlo,monospace\">--map<\u002Fspan> of column names, so most tabular exports work without writing code.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Item contract\" data-screen-label=\"71\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.15fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">The extension surface<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Adding a source is one generator.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">A parser yields plain dicts. Three fields are required; the rest are optional but useful. Hand the generator to <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">Corpus.ingest()<\u002Fspan> and dedup, watermarks, and coverage come along for free.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--ink)\">TikTok or LinkedIn is one function, not a subsystem.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:42px 40px;font:400 var(--t-mono)/1.65 ui-monospace,Menlo,monospace;color:var(--ink)\">\n    <div style=\"color:var(--mute)\"># required<\u002Fdiv>\n    <div><span style=\"color:var(--tel)\">bucket<\u002Fspan> · <span style=\"color:var(--tel)\">source<\u002Fspan> · <span style=\"color:var(--tel)\">direction<\u002Fspan><\u002Fdiv>\n    <div style=\"color:var(--mute);margin-top:22px\"># optional but useful<\u002Fdiv>\n    <div>ts (ISO-8601) · ts_raw · external_id<\u002Fdiv>\n    <div>contact {name, handle} · thread_id<\u002Fdiv>\n    <div>title · body · url · rating<\u002Fdiv>\n    <div>lat · lon · meta {…}<\u002Fdiv>\n    <div style=\"color:var(--grn);margin-top:22px\">Corpus.ingest(source, items, dedupe_against=[…])<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Partial coverage\" data-screen-label=\"72\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:42px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">A design guarantee<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1560px;text-wrap:pretty\">Partial coverage is a non-event.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1450px;text-wrap:pretty\">With Instagram DMs and bookmarks alone you can still produce a real profile, you simply scope the claims. Missing a source narrows the reading; it never breaks the pipeline.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Privacy\" data-screen-label=\"73\" style=\"background:var(--clay-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">Privacy &amp; safety<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">The guarantees that make it usable.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px 44px;margin-top:6px\">\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Local only, no telemetry<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">corpus.db is git-ignored and never leaves the machine. No examples pipe corpus contents anywhere.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Auth stays with you<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Passwords, 2FA codes, and payment info are never entered by the AI. Hard rule, not a preference.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Outputs stay filed<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Profiles and deep analyses live in a clearly-marked local folder, out of cross-session memory.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Loud failures, guarded writes<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">A bad working copy fails immediately, and sync refuses to shrink the store below 90%.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Roadmap &amp; Mirror Palace\" data-screen-label=\"74\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Status &amp; roadmap<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">v0.1, and what's next.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"border-top:1px solid var(--rule);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Engine, five skills, sixteen source parsers, smoke-tested<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--rule);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">A first-class Reddit parser (GDPR CSVs already load generically)<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--rule);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">corpus-merge, unify one contact across platforms<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--rule);padding-top:18px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">A richer Content Profile module<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;gap:22px\">\n    <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--prp)\">DOWNSTREAM<\u002Fdiv>\n    <div style=\"font:600 var(--t-sub)/1.15 'Cormorant Garamond',serif\">Mirror Palace<\u002Fdiv>\n    <p style=\"margin:0;font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">The cognitive-framework layer that reasons over this evidence: 49 frameworks, ten life domains, six agent archetypes. personal-corpus supplies what happened; Mirror Palace supplies what it means.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-mono)/1.4 ui-monospace,Menlo,monospace\"><a href=\"https://github.com/TaylorONeal/mirror-palace\">github.com/TaylorONeal/mirror-palace<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Closing\" data-screen-label=\"75\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:space-between;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">personal-corpus · product overview<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:34px\">\n    <p style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">One person, two lenses, one substrate.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1400px;text-wrap:pretty\">Start with whatever sources you have. Coverage tells you what to add next.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--pmute)\">\n    <span>github.com/TaylorONeal/personal-signature<\u002Fspan>\n    <span>MIT · installable as a Claude plugin<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"PART 3 · How it runs\" data-screen-label=\"76\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:34px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Part 3 of four<\u002Fdiv>\n  <h2 style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">The five-stage playbook.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px;text-wrap:pretty\">Request, collect, import, profile, analyze. What each step does, and the traps it already knows about.<\u002Fp>\n  <div style=\"display:flex;gap:16px;margin-top:10px\">\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--grn)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Pipeline\" data-screen-label=\"77\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:32px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The pipeline at a glance.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:grid;grid-template-columns:.7fr 1.1fr 2.4fr;gap:34px;padding:0 10px 18px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>STAGE<\u002Fspan><span>SKILL<\u002Fspan><span>WHEN TO USE IT<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.7fr 1.1fr 2.4fr;gap:34px;padding:30px 10px;border-bottom:1px solid var(--rule);align-items:baseline\"><span style=\"font:400 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--mute)\">1a. Request<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 ui-monospace,Menlo,monospace;color:var(--grn)\">corpus-acquire<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The user wants to pull their data, request exports, or start building a corpus.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.7fr 1.1fr 2.4fr;gap:34px;padding:30px 10px;border-bottom:1px solid var(--rule);align-items:baseline\"><span style=\"font:400 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--mute)\">1b. Collect<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 ui-monospace,Menlo,monospace;color:var(--grn)\">corpus-collect<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">They ask whether exports are ready, want to collect data, or want a recurring check.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.7fr 1.1fr 2.4fr;gap:34px;padding:30px 10px;border-bottom:1px solid var(--rule);align-items:baseline\"><span style=\"font:400 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--mute)\">2. Ingest<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 ui-monospace,Menlo,monospace;color:var(--tel)\">corpus-ingest<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Export files are in exports/ and they want to load their data or build the corpus.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.7fr 1.1fr 2.4fr;gap:34px;padding:30px 10px;border-bottom:1px solid var(--rule);align-items:baseline\"><span style=\"font:400 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--mute)\">3. Profile<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 ui-monospace,Menlo,monospace;color:var(--prp)\">corpus-profile<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">They want a profile, a voice signature, or a summary of what their data says about them.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.7fr 1.1fr 2.4fr;gap:34px;padding:30px 10px;align-items:baseline\"><span style=\"font:400 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--mute)\">4. Analyze<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 ui-monospace,Menlo,monospace;color:var(--prp)\">corpus-analyze<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">They want to go deeper, find patterns, or ask a specific question of their data.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Judgment vs mechanism\" data-screen-label=\"78\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">The split that holds the repo together<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">Skills encode judgment. The engine encodes mechanism.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px;margin-top:10px\">\n    <div style=\"border-top:1px solid var(--prule);padding-top:28px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 var(--t-sub)/1.15 'Cormorant Garamond',serif\">skills/<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Which export settings. Which traps silently bloat an archive. How to analyze honestly. When to stop and ask.<\u002Fspan>\n      <span style=\"font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace;color:var(--pmute)\">five SKILL.md files · skills.yaml<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:28px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 var(--t-sub)/1.15 'Cormorant Garamond',serif\">engine/<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">One schema, the Corpus ingest library, a parser registry, read helpers, and the coverage module.<\u002Fspan>\n      <span style=\"font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace;color:var(--pmute)\">schema.sql · corpus.py · parsers/ · run_ingest.py · query.py · coverage.py<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1500px;text-wrap:pretty\">Don't put mechanism in skills or judgment in the engine. Skills are thin; the engine is the substance.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"The contract\" data-screen-label=\"79\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">How stages talk<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Stages communicate only through state on disk.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">No skill calls another skill. Each one reads what the previous stage left behind and writes what the next one will need.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Every skill ends with an explicit handoff naming the next one.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">exports/_manifest.json<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Written by acquire, updated by collect: what was requested, what arrived, what's still pending.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">exports/&lt;platform&gt;/<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Raw archives, left zipped, kept forever.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.06em\">corpus.db<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The contract proper: items, contacts, sources, and per-source watermarks.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.06em\">identity.json<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Read by every parser to decide direction.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ 1 acquire\" data-screen-label=\"80\" style=\"background:var(--grn-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(79,209,197,.32)\">1a<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--grn);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 ui-monospace,Menlo,monospace\">corpus-acquire<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--grn)\">Get the data out of the platforms<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Acquire goal\" data-screen-label=\"81\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Stage 1a · goal<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">Get your data onto disk, small and parseable.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:6px\">\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">PRECONDITION 01<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">exports/ exists<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">One folder per platform, archives left zipped.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">PRECONDITION 02<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">identity.json filled<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Copied from the example, so parsers later know which handles are yours.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">PRECONDITION 03<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Fire everything up front<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Exports generate asynchronously, minutes to roughly 24 hours.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px;text-wrap:pretty\">Each request is recorded in <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">exports/_manifest.json<\u002Fspan> with a rough ETA, so collect knows what to watch for. Partial coverage is fine; the rest of the pipeline adapts.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Takeout\" data-screen-label=\"82\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Google Takeout<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Keep products separate.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">One giant product otherwise delays every other one. Request Mail, Chat, Voice, and YouTube as separate jobs.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">takeout.google.com/settings/takeout<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.4);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.08em\">THE TRAP<\u002Fspan><span style=\"font:400 var(--t-body)/1.35 'DM Sans',sans-serif\">Gmail defaults to \"Include all messages in Mail\", turn it OFF and tick only the Sent label.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">YOUTUBE<\u002Fspan><span style=\"font:400 var(--t-body)/1.35 'DM Sans',sans-serif\">Keep comments, playlists, subscriptions, and history. Drop the video files.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">ALSO COVERED<\u002Fspan><span style=\"font:400 var(--t-body)/1.35 'DM Sans',sans-serif\">Google Chat and Google Voice, each requested on its own.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Meta clear-all\" data-screen-label=\"83\" style=\"background:var(--clay-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:38px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">Instagram &amp; Facebook Messenger<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">The customize screen has multiple sections, each with its own \"Clear all\".<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:6px\">\n    <div style=\"background:rgba(217,112,102,.1);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">01<\u002Fspan><span style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">Clear every section, not just the first<\u002Fspan><\u002Fdiv>\n    <div style=\"background:rgba(217,112,102,.1);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">02<\u002Fspan><span style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">Select Messages only<\u002Fspan><\u002Fdiv>\n    <div style=\"background:rgba(217,112,102,.1);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">03<\u002Fspan><span style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">JSON format, All time<\u002Fspan><\u002Fdiv>\n    <div style=\"background:rgba(217,112,102,.1);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">04<\u002Fspan><span style=\"font:400 var(--t-body)/1.3 'DM Sans',sans-serif\">Lower media quality<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px\">Miss one section and the archive arrives tens of gigabytes larger, days later, mostly media you will never parse.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Other platforms\" data-screen-label=\"84\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Per-source playbook<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four more requests, plus the local copies.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;margin-top:6px\">\n    <div style=\"display:grid;grid-template-columns:1fr 2fr 1.1fr;gap:34px;padding:0 10px 16px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>PLATFORM<\u002Fspan><span>HOW<\u002Fspan><span>ETA<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 2fr 1.1fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">X / Twitter<\u002Fspan><span style=\"color:var(--mute)\">Full archive from Settings, one archive per handle<\u002Fspan><span style=\"color:var(--clay)\">~24 hours<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 2fr 1.1fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Reddit<\u002Fspan><span style=\"color:var(--mute)\">GDPR export at reddit.com/settings/data-request, CSVs of posts, comments, saved<\u002Fspan><span style=\"color:var(--mute)\">hours<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 2fr 1.1fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Slack<\u002Fspan><span style=\"color:var(--mute)\">Workspace export if you're an admin, otherwise per-DM<\u002Fspan><span style=\"color:var(--mute)\">varies<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 2fr 1.1fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Spotify<\u002Fspan><span style=\"color:var(--mute)\">Fastest via exportify, instant CSV of liked songs and playlists<\u002Fspan><span style=\"color:var(--grn)\">instant<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 2fr 1.1fr;gap:34px;padding:26px 10px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Local sources<\u002Fspan><span style=\"color:var(--mute)\">Copy iMessage's chat.db and a browser-bookmarks HTML export straight into exports/<\u002Fspan><span style=\"color:var(--grn)\">no request<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Auth hard rule\" data-screen-label=\"85\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:40px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Hard rule · never relaxed<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.1 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1560px;text-wrap:pretty\">The AI drives the UI up to the auth step and hands off.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1450px;text-wrap:pretty\">It never enters your password, your 2FA code, or your payment information. Nothing in the repo documents or automates anything that would.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ 1b collect\" data-screen-label=\"86\" style=\"background:var(--grn-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(79,209,197,.32)\">1b<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--grn);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 ui-monospace,Menlo,monospace\">corpus-collect<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--grn)\">Turn \"requested\" into \"on disk\"<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Collect goal\" data-screen-label=\"87\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Stage 1b · goal<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The bridge, and the stage that keeps running.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">It scans the connected mailbox for export-ready notifications so you don't babysit your inbox, then files each archive where the parsers expect it.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Requires an email connector. Best run on a schedule, daily is right for most people.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;gap:22px;align-items:baseline;border-top:1px solid var(--rule);padding-top:20px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:70px\">01<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Scan the mailbox for export-ready mail<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:22px;align-items:baseline;border-top:1px solid var(--rule);padding-top:20px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:70px\">02<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Surface what's ready: platform, date, download link<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:22px;align-items:baseline;border-top:1px solid var(--rule);padding-top:20px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:70px\">03<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Verify the link domain matches the platform<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:22px;align-items:baseline;border-top:1px solid var(--rule);padding-top:20px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:70px\">04<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Download with your confirmation, file it, update the manifest<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:22px;align-items:baseline;border-top:1px solid var(--rule);padding-top:20px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:70px\">05<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Offer to run ingest right away, in delta mode where the source already exists<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"What it watches\" data-screen-label=\"88\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">What it watches for.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column\">\n    <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:34px;padding:0 10px 16px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>PLATFORM<\u002Fspan><span>SENDER<\u002Fspan><span>SUBJECT PATTERN<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Google<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">noreply-dmrc@google.com<\u002Fspan><span style=\"color:var(--mute)\">\"Your Google data is ready\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Meta<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">security@facebookmail.com<\u002Fspan><span style=\"color:var(--mute)\">\"Your information is ready to download\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">X<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">x.com<\u002Fspan><span style=\"color:var(--mute)\">\"Your X data is ready\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:34px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Reddit<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">reddit.com<\u002Fspan><span style=\"color:var(--mute)\">\"Your Reddit data request\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.5fr 1.5fr;gap:34px;padding:26px 10px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif\"><span style=\"font-weight:500\">Spotify · Slack<\u002Fspan><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--mute)\">platform domains<\u002Fspan><span style=\"color:var(--mute)\">\"your data\" / \"export\"<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Em
