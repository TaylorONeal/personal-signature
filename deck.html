ail links are treated as untrusted input: the sender domain and the link domain both have to match the platform, or the skill stops and asks.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Filing &amp; expiry\" data-screen-label=\"89\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Filing convention<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">One folder per platform, archives left zipped.<\u002Fh2>\n    <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:34px 32px;font:400 var(--t-mono)/1.7 ui-monospace,Menlo,monospace;color:var(--ink)\">\n      <div>exports/instagram/<\u002Fdiv>\n      <div>exports/linkedin/<\u002Fdiv>\n      <div>exports/twitter/<\u002Fdiv>\n      <div style=\"color:var(--mute)\">exports/_manifest.json<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.4);border-radius:16px;padding:34px 32px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.08em\">TIME PRESSURE<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Download links typically lapse in about four days. The skill flags that urgently.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 32px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">SCHEDULED RUNS<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Report only new arrivals, stay silent on no-ops, and nudge about anything past its ETA.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 32px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">BOUNDARIES<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Read-only on email: never send, delete, or change settings. Every download is confirmed by filename, source, and size.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ 2 ingest\" data-screen-label=\"90\" style=\"background:var(--tel-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(212,165,116,.3)\">2<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--tel);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 ui-monospace,Menlo,monospace\">corpus-ingest<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--tel)\">Detect · ingest · report<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Detect\" data-screen-label=\"91\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',se ay:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Stream large archives<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Extract only the parse-relevant entries: message JSON, not media.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Open chat.db immutably<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">sqlite3 file:chat.db?immutable=1, and decode attributedBody on modern macOS.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Coverage-first<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">coverage.py is the contract between what exists and what you may claim.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Back up before every bulk run<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">cp corpus.db corpus.db.bak-$(date +%F-%H%M). Keep raw exports forever.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Report\" data-screen-label=\"94\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Step 3,
