umns:repeat(3,1fr);gap:28px;margin-top:4px\">\n    <div style=\"background:rgba(255,255,255,.04);border:1px solid var(--prule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">JOINS TIME<\u002Fspan>\n      <span style=\"font:400 var(--t-lead)/1.3 'Cormorant Garamond',serif;color:var(--pink)\">\"What was I listening to during the months I barely texted anyone?\"<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Needs saves and messages on one timeline. Spotify has half; Apple has the other half.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.04);border:1px solid var(--prule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">JOINS PEOPLE<\u002Fspan>\n      <span style=\"font:400 var(--t-lead)/1.3 'Cormorant Garamond',serif;color:var(--pink)\">\"Which friendships do I start, and which ones only continue?\"<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Needs direction and gaps per contact across iMessage, Instagram, and WhatsApp at once.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.04);border:1px solid var(--prule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">JOINS REGISTER<\u002Fspan>\n      <span style=\"font:400 var(--t-lead)/1.3 'Cormorant Garamond',serif;color:var(--pink)\">\"How differently do I write to a client than to my sister?\"<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Needs your sent text from email and texting side by side, labelled by relationship.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1550px;text-wrap:pretty\">Each of these is one question asked once, against one list. That is the whole payoff of tidying first and interpreting second.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Auditable\" data-screen-label=\"27\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">Why it can be trusted<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Auditable by construction.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:28px 44px;margin-top:6px\">\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Every entry traces back to a file<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The original downloads are kept forever, so your corpus is never the only copy of anything.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Duplicates collapse automatically<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Run the same import twice and nothing doubles, each entry is matched by its id, or by a fingerprint of its contents.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Updates only add what's new<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Each source remembers the date it last read up to, so refreshing next month takes seconds instead of hours.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Every claim shows its math<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A finding names the question it asked and the count it got back, printed beside it. You can re-run it and disagree.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">It refuses to quietly lose data<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">If a write would shrink your corpus by more than a tenth, it stops and says so rather than overwriting it.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">One list, not one per app<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Which is why having only some of your sources is normal rather than a broken state.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Coverage first\" data-screen-label=\"28\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1.05fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">The coverage check<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">It tells you what it can't know.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Before writing anything about you, the system counts what it actually has: how many entries, from which apps, covering which years. Every later claim is limited to that.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute)\">If your work chat was never exported, it says \"not enough to tell\" instead of inventing a professional voice for you.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:40px 38px;display:flex;flex-direction:column;gap:18px;font:400 var(--t-mono)/1.6 ui-monospace,Menlo,monospace\">\n    <div style=\"color:var(--mute)\">$ python engine/coverage.py<\u002Fdiv>\n    <div style=\"color:var(--grn)\">signal_in&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;24,880 items · 5 sources<\u002Fdiv>\n    <div style=\"color:var(--prp)\">communication&nbsp;78,410 items · 4 sources<\u002Fdiv>\n    <div style=\"color:var(--tel)\">published&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2,940 items · 2 sources<\u002Fdiv>\n    <div style=\"color:var(--clay)\">thin: work register (no work chat)<\u002Fdiv>\n    <div style=\"color:var(--ink)\">next best source: Apple Podcasts<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Not enough signal\" data-screen-label=\"29\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:44px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">The honesty rule<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.1 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px;text-wrap:pretty\">\"Not enough signal\" is a valid result.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1400px;text-wrap:pretty\">A claim resting on a thin slice gets flagged, never laundered into a finding. State the pattern, show the numbers, give the strongest counter-reading, and name what would kill it.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ IV divider\" data-screen-label=\"30\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:var(--prule)\">IV<\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">What the memory unlocks<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--pmute)\">Self-knowledge · patterns · agents<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Longitudinal self-knowledge\" data-screen-label=\"31\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Unlock 01<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Longitudinal self-knowledge.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:4px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Identity arc<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">cities, time spans, life chapters<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Interest evolution<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">formative layers vs. current<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Relationship arcs<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">who leads, how bonds start and end<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:34px 30px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Register map<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">texting vs. email vs. public voice<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">Two portraits from two halves of the same person: the Content Profile is your inputs, the Communication Signature is your outputs. The interesting findings live where they agree, or contradict.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Pattern detection\" data-screen-label=\"32\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Unlock 02<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Cross-source pattern detection.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">One source gives you a habit. Several sources, aligned on a timeline, give you a pattern, the kind a stranger could not guess and you cannot see from inside.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Reported as hypotheses about behavior, not verdicts about the person.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">INITIATION RATE<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">gap-based session starts, per relationship<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">SENT : RECEIVED<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">balance and length asymmetry by contact type<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">LATE-NIGHT SHARE<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">when candor happens, and with whom<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.08em\">INVERSIONS ACROSS TYPES<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">friend vs. family vs. partner, the real findings<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Generated profile\" data-screen-label=\"33\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">A profile, generated from the corpus.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">Signature-Profile.md<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:0;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--rule)\">\n    <div style=\"position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:20px 30px;border-bottom:1px solid var(--rule);background:#120d18\">\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--clay)\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--tel)\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--grn)\"><\u002Fspan>\n        <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);margin-left:12px\">Signature-Profile.md<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:32px 40px;display:grid;grid-template-columns:1.15fr 1fr;gap:44px;overflow:hidden\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"font:500 var(--t-mono)/1.4 ui-monospace,Menlo,monospace;color:var(--clay)\">## Coverage first<br><span style=\"color:var(--mute)\">9 sources · 106,230 entries · 2016 to today<br>thin: work register · marked pending, not described<\u002Fspan><\u002Fdiv>\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn)\">## The one-line read<\u002Fdiv>\n          <div style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">Publishes in public on a monthly rhythm and reads far more than gets written. 214 Substack essays sit on top of a saving habit running nine to one, kept to published.<\u002Fdiv>\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);margin-top:6px\">## Trends<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">· Publishing found a monthly cadence in 2022, after two years of bursts<br>· Reading widened while writing narrowed: 14 recurring domains, 3 recurring topics<br>· 61% of published essays were first drafted on a Sunday morning<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">## Relationships<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">· 3 iMessage threads carry 58% of everything sent<br>· Reader email gets a reply inside a day, friends inside three<br>· Group chats get 6-word messages, one-to-one gets 40<\u002Fdiv>\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);margin-top:6px\">## Voice<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">Long and cadenced in public, clipped and lowercase in iMessage. The essay voice leans on semicolons the texting voice never uses once.<\u002Fdiv>\n          <div style=\"margin-top:auto;border-top:1px solid var(--rule);padding-top:20px;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--clay)\">Caveat: no work chat was ever exported, so the professional register stays pending rather than guessed.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Mirror Palace\" data-screen-label=\"34\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Unlock 03 · the companion project<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">Better agent decisions: Mirror Palace.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">Mirror Palace is the cognitive-framework layer, 49 frameworks, ten life domains, six agent archetypes, that teaches an agent how a person works. It needs evidence. personal-corpus is where the evidence comes from.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center;margin-top:8px\">\n    <div style=\"background:rgba(79,209,197,.1);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">personal-corpus<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">What actually happened. Structured, deduped, timestamped, cited.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font:600 var(--t-title)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">→<\u002Fdiv>\n    <div style=\"background:rgba(246,135,179,.14);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--prp)\">Mirror Palace<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">What it means. Frameworks, domain status, pattern reads, agent briefings.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-mono)/1.4 ui-monospace,Menlo,monospace;color:var(--mute)\"><a href=\"https://github.com/TaylorONeal/mirror-palace\">github.com/TaylorONeal/mirror-palace<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Better answers\" data-screen-label=\"35\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:26px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The same question, asked twice.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">Without your corpus · with it<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:18px\">\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr 1.35fr;gap:24px;align-items:stretch\">\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">YOU ASK<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">\"Draft the follow-up to this recruiter.\"<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.08em\">GENERIC<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Polite, enthusiastic, three exclamation points. Not how you have ever written.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">WITH YOUR CORPUS<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Your working register, drawn from real email and LinkedIn threads: short, ask up front, no exclamation points, because you have sent none in 38,904 messages.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr 1.35fr;gap:24px;align-items:stretch\">\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">YOU ASK<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">\"What should I listen to tonight?\"<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.08em\">GENERIC<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">The five most popular albums of the month.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">WITH YOUR CORPUS<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Something in the lane that owns 61% of your saves, filtered to what you have never played, and it knows Thursday nights are when you reach for longer sets.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr 1.35fr;gap:24px;align-items:stretch\">\n      <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">YOU ASK<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">\"Who am I overdue with?\"<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.35);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.08em\">GENERIC<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Advice about the importance of staying in touch.<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">WITH YOUR CORPUS<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Four names. Each one a thread you normally answer within a day, quiet for six weeks, and in every case you were the one who used to write first.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--small)/1.45 'DM Sans',sans-serif;color:var(--mute);font-size:var(--t-small);max-width:1600px;flex:none\">None of the right-hand answers require a smarter model. They require the model to have read your list.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Evidence to advice\" data-screen-label=\"36\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:26px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp);flex:none\">Where Mirror Palace picks it up<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1500px;flex:none\">Evidence on the left. Advice on the right.<\u002Fh2>\n  <div data-om-raster=\"true\" style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px\">\n    <div style=\"display:grid;grid-template-columns:1.5fr 40px 1.1fr 40px 1.5fr;gap:0;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(246,135,179,.25)\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--grn)\">WHAT YOUR CORPUS HOLDS<\u002Fspan><span><\u002Fspan><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--tel);text-align:center\">READ AS<\u002Fspan><span><\u002Fspan><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--prp)\">WHAT IT CHANGES WHEN YOU ASK<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 40px 1.1fr 40px 1.5fr;align-items:center;padding:14px 0\">\n      <span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">38,904 sent messages, labelled by who they went to<\u002Fspan><span style=\"text-align:center;color:var(--tel);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;text-align:center\">your register, per audience<\u002Fspan><span style=\"text-align:center;color:var(--prp);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Drafts that sound like you wrote them, tuned to who is reading<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 40px 1.1fr 40px 1.5fr;align-items:center;padding:14px 0;border-top:1px solid rgba(246,135,179,.15)\">\n      <span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Who starts threads, who answers, and how fast<\u002Fspan><span style=\"text-align:center;color:var(--tel);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;text-align:center\">how your bonds actually run<\u002Fspan><span style=\"text-align:center;color:var(--prp);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Reach-out suggestions that name the right person at the right time<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 40px 1.1fr 40px 1.5fr;align-items:center;padding:14px 0;border-top:1px solid rgba(246,135,179,.15)\">\n      <span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">A decade of saves, watches, and bookmarks<\u002Fspan><span style=\"text-align:center;color:var(--tel);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;text-align:center\">taste, and how it drifted<\u002Fspan><span style=\"text-align:center;color:var(--prp);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Media picks in your lane, not the popular lane<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 40px 1.1fr 40px 1.5fr;align-items:center;padding:14px 0;border-top:1px solid rgba(246,135,179,.15)\">\n      <span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">Calendar history beside message volume<\u002Fspan><span style=\"text-align:center;color:var(--tel);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;text-align:center\">your real capacity by week<\u002Fspan><span style=\"text-align:center;color:var(--prp);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Plans paced to weeks you survived, not weeks you imagined<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.5fr 40px 1.1fr 40px 1.5fr;align-items:center;padding:14px 0;border-top:1px solid rgba(246,135,179,.15)\">\n      <span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">The same interest surfacing across years and apps<\u002Fspan><span style=\"text-align:center;color:var(--tel);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.3 'DM Sans',sans-serif;text-align:center\">what you keep returning to<\u002Fspan><span style=\"text-align:center;color:var(--prp);font:400 var(--t-lead)/1 ui-monospace,Menlo,monospace\">→<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif\">Strategy advice that backs the thread you never drop<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1600px;flex:none\">The middle column is the part Mirror Palace supplies. It cannot invent the left column, which is exactly why the corpus comes first.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"One loop\" data-screen-label=\"37\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:34px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Two projects, one cycle.<\u002Fh2>\n  <div data-om-raster=\"true\" style=\"flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:stretch\">\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">01 EVIDENCE<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">corpus.db<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Years of behavior, normalized into one local store.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">02 READING<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">profile + analyze<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Two portraits, cited patterns, coverage caveats.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">03 INTERPRETATION<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Mirror Palace<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Frameworks turn patterns into decisions and domain status.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);letter-spacing:.1em\">04 NEW TRAIL<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">back to the corpus<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Next month's update pulls in what happened since, and the cycle starts over.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1450px\">Ordinary project memory helps you finish things. This kind helps you see what you keep doing.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Privacy\" data-screen-label=\"38\" style=\"background:var(--clay-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">Privacy &amp; safety<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Six hard rules.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px 44px;margin-top:4px\">\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Local only<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The DB never leaves your machine. No cloud, no telemetry.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Never your credentials<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The AI drives export UIs up to the auth step and hands password and 2FA to you.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Nothing sensitive in memory<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Personal, relationship, and health detail stays out of cross-session memory.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Back up before bulk runs<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The shrink-guard is a seatbelt; a timestamped copy is the real safety net.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Keep your raw exports<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">They are the backup of last resort, and the audit trail.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Deep analyses stay filed<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Sensitive write-ups go to a clearly-marked local folder, no names unless you ask.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Where it runs\" data-screen-label=\"39\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn);flex:none\">Getting started · what you need<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1500px;flex:none\">Three things, and you probably have two.<\u002Fh2>\n  <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;align-items:stretch\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">01 A COMPUTER YOU OWN<\u002Fspan>\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif\">Mac, Windows, or Linux with Python<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">This is where everything lives. Your downloads, your list, your profile. Nothing is hosted, so there is nothing to sign up for.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:rgba(245,240,232,.45);margin-top:auto\">A decade of messages is a few hundred megabytes. Any laptop is enough.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.45);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">02 AN AI AGENT THAT CAN CLICK<\u002Fspan>\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--tel)\">Claude Code, or any agent with browser control<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">It reads the five guides in this project and does the tedious parts: navigating each export screen, ticking the right boxes, watching your inbox, running the imports.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:rgba(245,240,232,.45);margin-top:auto\">Works in a terminal. Browser steps need a browser-control tool connected.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.1em\">03 YOUR OWN LOGINS<\u002Fspan>\n      <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif\">You type the passwords<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The agent drives each export screen right up to the sign-in box and then stops and hands the keyboard back to you. Passwords and two-factor codes are always yours.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:rgba(245,240,232,.45);margin-top:auto\">A hard rule in the guides, not a preference.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Install\" data-screen-label=\"40\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.1fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Getting started · setup<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Clone it, install the guides, name yourself.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Installing adds five guides to your agent: how to request exports, how to collect them, how to import, how to build the portrait, how to go deeper. You then talk to it in plain English.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--ink)\">The only thing you fill in by hand is your own phone numbers, emails, and usernames, so it can tell your words from everyone else's.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:40px 38px;display:flex;flex-direction:column;gap:14px;font:400 var(--t-mono)/1.55 ui-monospace,Menlo,monospace;color:var(--ink)\">\n    <div style=\"color:rgba(245,240,232,.45)\"># 1. get the project<\u002Fdiv>\n    <div>git clone github.com/TaylorONeal/personal-signature<\u002Fdiv>\n    <div>cd personal-signature<\u002Fdiv>\n    <div style=\"color:rgba(245,240,232,.45);margin-top:14px\"># 2. add the guides to your agent<\u002Fdiv>\n    <div style=\"color:var(--tel)\">/plugin marketplace add ./<\u002Fdiv>\n    <div style=\"color:var(--tel)\">/plugin install personal-corpus<\u002Fdiv>\n    <div style=\"color:rgba(245,240,232,.45);margin-top:14px\"># 3. say who you are<\u002Fdiv>\n    <div>mkdir -p exports<\u002Fdiv>\n    <div>cp identity.example.json identity.json<\u002Fdiv>\n    <div style=\"color:var(--grn);margin-top:14px\"># then just ask:<\u002Fdiv>\n    <div style=\"color:var(--grn)\">\"request my exports\"<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"First day\" data-screen-label=\"41\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:26px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">What the first day actually looks like.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">Mostly waiting, briefly working<\u002Fspan>\n  <\u002Fdiv>\n  <div data-om-raster=\"true\" style=\"flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:0\">\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;padding:22px 0;border-bottom:1px solid var(--rule)\">\n      <span style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">MINUTE 0<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">You say \"request my exports\"<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The agent asks which apps you use, then opens each export screen in turn. You type the passwords when it pauses.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;padding:22px 0;border-bottom:1px solid var(--rule)\">\n      <span style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">MINUTE 30<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Every request is in, and the local sources are already done<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">iMessage and your bookmarks need no request, so they can be imported immediately. You can see a first coverage count today.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;padding:22px 0;border-bottom:1px solid var(--rule)\">\n      <span style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.06em\">HOURS LATER<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Emails start arriving: \"your data is ready\"<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Some apps take minutes, some take a full day. The agent watches your inbox and files each download as it lands, and warns you before a link expires.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;padding:22px 0;border-bottom:1px solid var(--rule)\">\n      <span style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.06em\">DAY 2<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">You say \"import what came in\"<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Each file is read once and turned into tidy entries. Duplicates collapse on their own, so running it twice costs nothing but time.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:start;padding:22px 0\">\n      <span style=\"font:500 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.06em\">THEN<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">You say \"build my profile\"<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">It counts what it has, tells you what is thin, and writes the portrait. From here on, refreshing a source takes seconds.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1600px;flex:none\">You never have to know a command. Every step above is also a plain sentence you can say to the agent.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Start here\" data-screen-label=\"42\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1.15fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Keeping it current<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Then it stays fresh on its own.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Set the collect step to run daily and it quietly watches for new exports. Imports after the first one only add what is new, so a refresh is seconds rather than hours.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Version 0.1, sixteen apps supported, five guided steps, installable in one command. Free and open source.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#120d18;border:1px solid var(--rule);border-radius:16px;padding:40px 38px;display:flex;flex-direction:column;gap:16px;font:400 var(--t-mono)/1.55 ui-monospace,Menlo,monospace;color:var(--ink)\">\n    <div style=\"color:rgba(245,240,232,.45)\"># only add what is new<\u002Fdiv>\n    <div>python engine/run_ingest.py imessage exports/chat.db <span style=\"color:var(--tel)\">--mode delta<\u002Fspan><\u002Fdiv>\n    <div style=\"color:rgba(245,240,232,.45);margin-top:14px\"># back up before a big run<\u002Fdiv>\n    <div>cp corpus.db corpus.db.bak-$(date +%F)<\u002Fdiv>\n    <div style=\"color:rgba(245,240,232,.45);margin-top:14px\"># see where you stand<\u002Fdiv>\n    <div style=\"color:var(--grn)\">python engine/coverage.py<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Closing\" data-screen-label=\"43\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:space-between;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">personal-corpus<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:34px\">\n    <p style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">Same data, opposite owner.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1400px;text-wrap:pretty\">Your corpus is a foundation, not a finished report. The profile is only the first thing that reads from it.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--pmute)\">\n    <span>github.com/TaylorONeal/personal-signature<\u002Fspan>\n    <span>Free, open source, contributions welcome<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"PART 2 · What it makes\" data-screen-label=\"44\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:34px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Part 2 of four<\u002Fdiv>\n  <h2 style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">Two portraits and a substrate.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px;text-wrap:pretty\">The Content Profile, the Communication Signature, and the one plain list both are built from.<\u002Fp>\n  <div style=\"display:flex;gap:16px;margin-top:10px\">\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--grn)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"In one slide\" data-screen-label=\"45\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">The whole system<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">A local toolkit that turns your data exports into a queryable model of you.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:8px\">\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:40px 34px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">OUTPUT 01<\u002Fspan>\n      <span style=\"font:600 var(--t-lead)/1.2 'Cormorant Garamond',serif\">Content Profile<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">What you consume and are into, taste, interests, obsessions.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:40px 34px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">OUTPUT 02<\u002Fspan>\n      <span style=\"font:600 var(--t-lead)/1.2 'Cormorant Garamond',serif\">Communication Signature<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">How you write and relate, voice, register, relationship dynamics.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.45);border-radius:16px;padding:40px 34px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">OUTPUT 03<\u002Fspan>\n      <span style=\"font:600 var(--t-lead)/1.2 'Cormorant Garamond',serif\">corpus.db<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The substrate, plain SQLite with full-text search and read helpers.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">One person, two lenses, one substrate. Keeping the two portraits distinct is the core design idea.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Architecture\" data-screen-label=\"46\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The shape of the system.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1450px\">Four stages on a shared local database. Stages communicate only through the store, so any stage runs on whatever the previous one produced.<\u002Fp>\n  <div data-om-raster=\"true\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Acquire<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">request exports<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Collect<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">watch inbox, download<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Ingest<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">parse + store<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1.15;background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif;color:var(--grn)\">corpus.db<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">items · contacts · sources<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--tel-bg);border:1px solid rgba(212,165,116,.45);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif;color:var(--tel)\">your own apps<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">query.py · skills · yours<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:center\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute);min-width:330px\">EVERY ITEM LANDS IN ONE BUCKET<\u002Fspan>\n      <div style=\"flex:1;border:1px solid var(--rule);border-radius:100px;padding:18px 0;text-align:center;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn)\">signal_in<\u002Fdiv>\n      <div style=\"flex:1;border:1px solid var(--rule);border-radius:100px;padding:18px 0;text-align:center;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">communication<\u002Fdiv>\n      <div style=\"flex:1;border:1px solid var(--rule);border-radius:100px;padding:18px 0;text-align:center;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--ink)\">published<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n      <div style=\"background:rgba(79,209,197,.09);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:32px 30px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">Content Profile<\u002Fspan>\n        <span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">from signal_in, plus the topical side of published<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:rgba(246,135,179,.11);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:32px 30px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--prp)\">Communication Signature<\u002Fspan>\n        <span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">from communication, plus the voice side of published<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Why this shape\" data-screen-label=\"47\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Design rationale<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">The hard problems are at the edges, not the middle.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:10px\">\n    <div style=\"border-top:1px solid var(--prule);padding-top:26px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Acquisition is fragile<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--pmute)\">Every platform's export UI differs, changes, and gates on auth. And it's slow, hours to days, asynchronously.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:26px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Synthesis is generative<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--pmute)\">Profiling and analysis benefit from being separate from ingestion, so they can re-run cheaply and often.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:26px;display:flex;flex-direction:column;gap:14px\">\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">A clean store is stable<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--pmute)\">So the store becomes the contract, and everything around it stays independent and replaceable.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1450px;text-wrap:pretty\">A user with two sources and a user with fifteen run the same code.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ I divider\" data-screen-label=\"48\" style=\"background:var(--grn-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(79,209,197,.35)\">I<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--grn);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">The Content Profile<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--grn)\">What you consume &amp; are into<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Content Profile\" data-screen-label=\"49\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">What it is<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Built from what you take in.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Music you save, videos you watch, articles you bookmark, books you read, restaurants you review, places you travel.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--ink)\">It answers: what are this person's tastes, interests, and obsessions? What do their inputs say about them?<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--grn)\">FED BY<\u002Fdiv>\n    <div style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">The <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--grn)\">signal_in<\u002Fspan> bucket, plus the topical side of <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">published<\u002Fspan>.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:26px;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\">DIRECTIONS RECORDED<\u002Fdiv>\n    <div style=\"font:400 var(--t-mono)/1.6 ui-monospace,Menlo,monospace;color:var(--mute)\">liked · played · watched · bookmarked · rated · visited<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Content sources\" data-screen-label=\"50\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Content Profile · sources<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Eight inputs, any subset.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:6px\">\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Spotify<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">liked songs, playlists<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">YouTube<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">watch history, subscriptions<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Netflix<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">viewing activity<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Bookmarks<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">browser HTML export<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Yelp<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">reviews, ratings, places<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Food &amp; orders<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">tabular exports via csv<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Travel<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">bookings, visits, coordinates<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:14px;padding:30px 26px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Podcasts<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">subscriptions, plays<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px\">Goodreads and Reddit CSVs load through the generic csv kind with a column map, no code required.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Content outputs\" data-screen-label=\"51\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Content Profile · outputs<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four readings of your inputs.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:6px\">\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Taste clusters<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Genres, moods, and era signature drawn from what you actually saved and replayed.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Interest map<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Top domains and keywords from bookmarks and history, the themes you collect.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Places, food, travel footprint<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Categories from reviews and orders, coordinates where the export carries them.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Evolution over time<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">How themes shift across years: formative layers versus what's current.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ II divider\" data-screen-label=\"52\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(246,135,179,.35)\">II<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--prp);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 'Cormorant Garamond',serif\">The Communication Signature<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--prp)\">How you write &amp; relate<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Comm Signature\" data-screen-label=\"53\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">What it is<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Built from what you put out to people.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Your messages, emails, posts, and reviews, the text that was written to someone, for a reason.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--ink)\">It answers: what is this person's voice, in each context? Who do they talk to, and how?<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:44px 40px;display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--prp)\">FED BY<\u002Fdiv>\n    <div style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\"><span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">communication<\u002Fspan> for relationships and private voice; <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--ink)\">published<\u002Fspan> for public voice.<\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:26px;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\">DIRECTIONS RECORDED<\u002Fdiv>\n    <div style=\"font:400 var(--t-mono)/1.6 ui-monospace,Menlo,monospace;color:var(--mute)\">sent · received · posted<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Comm sources\" data-screen-label=\"54\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Communication Signature · sources<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Eleven message and post sources.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:6px\">\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">iMessage<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Gmail (Sent)<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Instagram DMs<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Facebook Messenger<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Google Chat<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Google Voice<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">WhatsApp<\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Slack<\u002Fdiv>\n    <div style=\"border:1px solid rgba(246,135,179,.4);background:rgba(246,135,179,.08);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">X / Twitter<\u002Fdiv>\n    <div style=\"border:1px solid rgba(246,135,179,.4);background:rgba(246,135,179,.08);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Yelp reviews<\u002Fdiv>\n    <div style=\"border:1px solid rgba(246,135,179,.4);background:rgba(246,135,179,.08);border-radius:12px;padding:26px 24px;font:400 var(--t-body)/1.2 'DM Sans',sans-serif\">Blog / long-form<\u002Fdiv>\n    <div style=\"border:1px dashed var(--rule);border-radius:12px;padding:26px 24px;font:400 var(--t-small)/1.3 'DM Sans',sans-serif;color:var(--mute)\">+ anything jsonl<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Tinted sources are <span style=\"font-family:ui-monospace,Menlo,monospace;color:var(--prp)\">published<\u002Fspan>, they feed the public register and the Content Profile's topics.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Comm outputs\" data-screen-label=\"55\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Communication Signature · outputs<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Three artifacts.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:6px\">\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:38px 32px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">01<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Voice block<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A drop-in system-prompt block, \"Write as &lt;name&gt;\", with tics, tells, and do/don't, each trait backed by a verbatim line.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:38px 32px;display:flex;flex-direction:column;gap:16px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">02<\u002Fspan>\n      <span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Register map<\
