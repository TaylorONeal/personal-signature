v style=\"border-top:1px solid var(--rule);padding-top:14px;color:var(--clay)\">thin&nbsp;&nbsp;work register · places &amp; travel<\u002Fdiv>\n      <div style=\"color:var(--tel)\">next best source&nbsp;&nbsp;apple podcasts<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">What's in the corpus, which dimensions are thin, and which source would add the most next.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"§ 3 profile\" data-screen-label=\"95\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(246,135,179,.32)\">3<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--prp);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 ui-monospace,Menlo,monospace\">corpus-profile<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--prp)\">Fast, repeatable, coverage-aware<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Profile artifacts\" data-screen-label=\"96\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Stage 3 · outputs<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">It writes two files.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:6px\">\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:40px 36px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 var(--t-lead)/1.1 ui-monospace,Menlo,monospace;color:var(--prp)\">Signature-Profile.md<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">A one-page profile: a one-line read, who-they-are-in-the-data, trends, relationships, a voice summary, and coverage caveats up top.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--ink);border-top:1px solid rgba(246,135,179,.3);padding-top:18px\">Non-obvious findings are marked explicitly.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:40px 36px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 var(--t-lead)/1.1 ui-monospace,Menlo,monospace;color:var(--prp)\">voice-signature.md<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">A drop-in system-prompt block, \"Write as &lt;name&gt;…\", plus a register map, tics and tells, do/don't, and light stats.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--ink);border-top:1px solid rgba(246,135,179,.3);padding-top:18px\">Every trait is backed by a verbatim line from the corpus.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px\">Deterministic where possible: every claim traces to a query, not a vibe.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Profile run order\" data-screen-label=\"97\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Stage 3 · run order<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Coverage first, then five structured pulls.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:20px;margin-top:4px\">\n    <div style=\"display:grid;grid-template-columns:80px 300px 1fr;gap:34px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">00<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Coverage<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Note thin or missing dimensions up top, so nothing reads as more complete than it is.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 300px 1fr;gap:34px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">01<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Identity arc<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Cities and time spans, life chapters.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 300px 1fr;gap:34px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">02<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Volume and trends<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">v_monthly_volume, peaks and dips by year and bucket.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 300px 1fr;gap:34px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">03<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Relationships<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">v_top_contacts, sent-to-received ratio, who initiates, durable versus ended bonds.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 300px 1fr;gap:34px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">04<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Interests<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Top domains and keywords, genres and mood, review and order categories, watch themes.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 300px 1fr;gap:34px;align-items:baseline;border-top:1px solid var(--rule);padding-top:22px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">05<\u002Fspan><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Voice<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Per-register samples of your own words, starting from query.py voice-sample.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Profile principles\" data-screen-label=\"98\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Stage 3 · principles<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Five commitments the profile holds.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:30px;margin-top:12px\">\n    <div style=\"border-top:1px solid var(--prule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Coverage-aware<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">With only IG and bookmarks you still get a real profile, you just scope the claims.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Non-obvious over generic<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Cross-source patterns, not horoscope filler.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Honest<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">A register missing from the corpus is \"pending\", never fabricated.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Private<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Outputs stay local; nothing personal, relational, or medical enters cross-session memory.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-body)/1.2 'DM Sans',sans-serif\">Repeatable<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--pmute)\">Re-run any time new sources land; it notes what changed since the last profile.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"§ 4 analyze\" data-screen-label=\"99\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:flex-end;gap:20px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:500 var(--t-num)/0.85 'Cormorant Garamond',serif;color:rgba(246,135,179,.32)\">4<\u002Fdiv>\n  <div style=\"border-top:2px solid var(--prp);padding-top:30px;display:flex;justify-content:space-between;align-items:baseline\">\n    <h2 style=\"margin:0;font:600 var(--t-title)/1 ui-monospace,Menlo,monospace\">corpus-analyze<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--prp)\">Heavy, generative, cited<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Analyze modules\" data-screen-label=\"100\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Stage 4 · modules<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Five deep dives, on demand.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:4px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Communication patterns<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Per-relationship sent:received, initiation rate, length asymmetry, late-night share, response cadence, compared across relationship types.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Relationship dynamics<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The arc of one bond over time: volume, who-leads drift, how it started and how it ended. Patterns only, unless you ask for specifics.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Interest evolution<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">How themes shift across years, formative layers versus current.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Timeline / life chapters<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Cross-source events by period, moves, immersions, gaps, and the rhythm underneath.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Open-ended: non-obvious<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Scan for cross-source agreements and contradictions. Report what a stranger couldn't guess.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:34px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif;color:var(--prp)\">The real findings<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Inversions across types, friend versus family versus partner, are where something actually shows up.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Analyze method\" data-screen-label=\"101\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Stage 4 · method<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four steps, every module, no exceptions.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:6px\">\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">01 COMPUTE<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Don't intuit<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Write the query, get the numbers, cite them inline.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">02 COUNTER-READ<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Lead with the rival<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">State the pattern plainly, then give the strongest alternative explanation for the same numbers.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">03 CAVEAT<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Name the limits<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Sample size, missing directions or sources, eras not captured. Thin slices are flagged, not laundered.<\u002Fspan><\u002Fdiv>\n    <div style=\"border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">04 FALSIFY<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">End with a test<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">One concrete experiment or query that would confirm or kill the reading.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Analyze guardrails\" data-screen-label=\"102\" style=\"background:var(--clay-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">Stage 4 · guardrails<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Rigor, not flattery, and not diagnosis.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px 44px;margin-top:4px\">\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Don't over-pathologize<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Name patterns clearly, even uncomfortable ones, as hypotheses about behavior, not verdicts about the person.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Separate description from prescription<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">What the data shows is a different section from what to do about it.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Sensitive analyses stay filed<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Relationships, health, psychology: a clearly-marked local folder, never cross-session memory.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">No names unless you ask<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Pattern write-ups carry no specifics or identities by default.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">\"Not enough signal\" is a result<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">If the data genuinely can't answer the question, that is the answer.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Every claim cites a query<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">So a reader can re-run it and disagree with the number, not the mood.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Analysis output\" data-screen-label=\"103\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">An analysis, as it reads.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">Pattern · numbers · counter-read · next step<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:0;position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden\">\n    <div style=\"position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:20px 30px;border-bottom:1px solid var(--rule);background:#120d18\">\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--clay)\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--tel)\"><\u002Fspan>\n        <span style=\"width:12px;height:12px;border-radius:999px;background:var(--grn)\"><\u002Fspan>\n        <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);margin-left:12px\">analysis/communication-patterns.md<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:30px 40px;display:grid;grid-template-columns:1fr 1fr;gap:44px;overflow:hidden\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn)\">## Pattern<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--ink)\">Initiation inverts by relationship type: you open 71% of friend threads and 22% of family threads.<\u002Fdiv>\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);margin-top:4px\">## Numbers<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">friends&nbsp;&nbsp;<span style=\"color:var(--ink)\">71%<\u002Fspan> of 1,204 sessions (n=11)<br>family&nbsp;&nbsp;&nbsp;<span style=\"color:var(--ink)\">22%<\u002Fspan> of 388 sessions (n=4)<br>partner&nbsp;&nbsp;<span style=\"color:var(--ink)\">49%<\u002Fspan> of 2,911 sessions (n=1)<br><span style=\"color:rgba(245,240,232,.42)\">sessions = 6h+ gap · v_top_contacts<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay)\">## Strongest counter-reading<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">Family may coordinate by phone call, which this corpus does not capture. The same numbers would appear if they simply call first.<\u002Fdiv>\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);margin-top:4px\">## Caveats<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--mute)\">n=4 for family. Pre-2016 Messenger not ingested. Reported as a hypothesis about behavior, not a verdict.<\u002Fdiv>\n          <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);margin-top:4px\">## Next step<\u002Fdiv>\n          <div style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--ink)\">Ingest Google Voice call logs. If family call-initiation is above 60%, this finding dies.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Skill file shape\" data-screen-label=\"104\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">For contributors<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Every skill file has the same shape.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">Frontmatter is exactly name plus description: a double-quoted single-line YAML scalar, third person, stating both what the skill does and when to use it, under 1024 characters.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The same information in machine-readable form lives in skills.yaml, which tools can parse directly.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:26px;align-items:baseline\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:60px\">01<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Pipeline-stage line: \"Stage N of the pipeline (acquire → collect → ingest → profile/analyze)\"<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:26px;align-items:baseline\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:60px\">02<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">A one-sentence goal<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:26px;align-items:baseline\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:60px\">03<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Ordered workflow sections<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:26px;align-items:baseline\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:60px\">04<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Guardrails<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:26px;align-items:baseline\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);min-width:60px\">05<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">An explicit handoff naming the next skill<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:20px;display:flex;gap:26px;align-items:baseline\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);min-width:60px\">!<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Document both modes: the initial run and the ongoing scan<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Handoff\" data-screen-label=\"105\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">The stage after stage four<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1400px\">Where the findings go: Mirror Palace.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">analyze produces cited patterns. Mirror Palace is the framework layer that reasons over them, turning \"this is what happened\" into domain status, decision support, and an agent that paces itself to you.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center;margin-top:6px\">\n    <div style=\"background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">This repo<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Evidence: exports → corpus.db → two portraits → cited analyses.<\u002Fspan><\u002Fdiv>\n    <div style=\"font:600 var(--t-title)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">→<\u002Fdiv>\n    <div style=\"background:rgba(246,135,179,.16);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--prp)\">Mirror Palace<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Interpretation: frameworks, life domains, decisions ledger, six agent archetypes.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-mono)/1.4 ui-monospace,Menlo,monospace;color:var(--mute)\"><a href=\"https://github.com/TaylorONeal/mirror-palace\">github.com/TaylorONeal/mirror-palace<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Closing\" data-screen-label=\"106\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:space-between;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">personal-corpus · skills walkthrough<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:34px\">\n    <p style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">acquire → collect → ingest → profile / analyze<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1400px;text-wrap:pretty\">Five skills, thin by design. The judgment is written down so it can be argued with.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--pmute)\">\n    <span>github.com/TaylorONeal/personal-signature<\u002Fspan>\n    <span>Contributions welcome · MIT<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"PART 4 · The case\" data-screen-label=\"107\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:34px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Part 4 of four<\u002Fdiv>\n  <h2 style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1500px\">The pitch.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1400px;text-wrap:pretty\">The problem, the wedge, how it sits against the alternatives, and what would move it forward.<\u002Fp>\n  <div style=\"display:flex;gap:16px;margin-top:10px\">\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--rule)\"><\u002Fdiv>\n    <div style=\"flex:1;height:5px;border-radius:99px;background:var(--grn)\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The problem\" data-screen-label=\"108\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:42px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">The problem<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1600px;text-wrap:pretty\">AI got good at remembering your projects. It knows nothing about you.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1450px;text-wrap:pretty\">Every assistant starts each conversation from zero on taste, voice, relationships, and history, so it writes in generic assistant prose and recommends the median thing.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Rented models\" data-screen-label=\"109\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">Why it stays that way<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">The good models of a person are rented, not owned.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:8px\">\n    <div style=\"background:var(--clay-bg);border:1px solid rgba(217,112,102,.35);border-radius:16px;padding:42px 38px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--clay);letter-spacing:.1em\">TODAY<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">Platforms hold rich behavioral models of every user. Access is a product decision, the objective is their revenue, and the data is reconstructed from fragments.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A user cannot point them at their own goals.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:42px 38px;display:flex;flex-direction:column;gap:18px\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">AVAILABLE, UNUSED<\u002Fspan>\n      <span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif\">The same raw material sits in the exports every user is legally entitled to download, first-party, complete, and years deep.<\u002Fspan>\n      <span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Almost nobody uses them, because parsing them is miserable.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px;text-wrap:pretty\">The gap is not access to data. It is the absence of tooling between a downloaded archive and something an agent can read.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"The wedge\" data-screen-label=\"110\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:center;gap:42px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">The wedge<\u002Fdiv>\n  <p style=\"margin:0;font:500 var(--t-hero)/1.08 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1600px;text-wrap:pretty\">Export rights plus local compute is enough to build the model yourself.<\u002Fp>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1450px;text-wrap:pretty\">No API deals, no platform permission, no cloud bill. Sixteen parsers, one schema, and a local SQLite file are the entire dependency list.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"What we built\" data-screen-label=\"111\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">What exists today<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Two portraits and a substrate.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:8px\">\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:40px 34px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">01<\u002Fspan><span style=\"font:600 var(--t-lead)/1.2 'Cormorant Garamond',serif\">Content Profile<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Taste clusters, interest map, places and travel footprint, and how interests evolved, built from what a person consumes.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:40px 34px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">02<\u002Fspan><span style=\"font:600 var(--t-lead)/1.2 'Cormorant Garamond',serif\">Communication Signature<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A drop-in voice block, a register map, and relationship dynamics, built from what they write and to whom.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.45);border-radius:16px;padding:40px 34px;display:flex;flex-direction:column;gap:16px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">03<\u002Fspan><span style=\"font:600 var(--t-lead)/1.2 'Cormorant Garamond',serif\">corpus.db<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Plain SQLite with full-text search and read helpers, the layer any downstream app, agent, or script reads.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px\">Five skills drive it end to end: acquire, collect, ingest, profile, analyze.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Architecture\" data-screen-label=\"112\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four stages, one contract.<\u002Fh2>\n  <div data-om-raster=\"true\" style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Acquire<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">request exports<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Collect<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">watch inbox, download<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif\">Ingest<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">parse + store<\u002Fspan><\u002Fdiv>\n      <div style=\"color:var(--mute);font-size:var(--t-lead)\">→<\u002Fdiv>\n      <div style=\"flex:1.15;background:var(--grn-bg);border:1px solid rgba(79,209,197,.45);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:8px\"><span style=\"font:500 var(--t-body)/1 'DM Sans',sans-serif;color:var(--grn)\">corpus.db<\u002Fspan><span style=\"font:400 var(--t-mono)/1.3 ui-monospace,Menlo,monospace;color:var(--mute)\">items · contacts · sources<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:16px;align-items:center\">\n      <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute);min-width:300px\">THREE BUCKETS, THREE DIMENSIONS<\u002Fspan>\n      <div style=\"flex:1;border:1px solid var(--rule);border-radius:100px;padding:18px 0;text-align:center;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn)\">signal_in → interests<\u002Fdiv>\n      <div style=\"flex:1;border:1px solid var(--rule);border-radius:100px;padding:18px 0;text-align:center;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">communication → voice + relationships<\u002Fdiv>\n      <div style=\"flex:1;border:1px solid var(--rule);border-radius:100px;padding:18px 0;text-align:center;font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--ink)\">published → both<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px\">\n      <div style=\"background:rgba(79,209,197,.09);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:30px 28px;font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--grn)\">Content Profile<\u002Fdiv>\n      <div style=\"background:rgba(246,135,179,.11);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:30px 28px;font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--prp)\">Communication Signature<\u002Fdiv>\n      <div style=\"background:rgba(212,165,116,.09);border:1px solid rgba(212,165,116,.45);border-radius:16px;padding:30px 28px;font:500 var(--t-body)/1.2 'DM Sans',sans-serif;color:var(--tel)\">Downstream apps &amp; agents<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Stages talk only through the store, so a user with two sources and a user with fifteen run identical code.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Why now\" data-screen-label=\"113\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">Why now<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four things converged.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:28px 44px;margin-top:6px\">\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Export rights are universal now<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">GDPR-style portability made a full personal archive a checkbox at every major platform.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Agents can drive the boring parts<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Requesting exports, watching an inbox, and filing archives is exactly the work a skill-driven agent can own.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Context is the binding constraint<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Model quality is no longer the bottleneck in personal assistance; knowing the person is.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--rule);padding-top:24px;display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Local is finally cheap<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A decade of one person's messages is a few hundred megabytes of SQLite. It fits on a laptop with room to spare.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Who needs it\" data-screen-label=\"114\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">Who it's for<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Four audiences, in order of urgency.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:6px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">01<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Agent builders<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Anyone shipping a personal assistant who needs real user context and can't get it from a platform.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">02<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Quantified-self practitioners<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">People already logging their lives who have no store that unifies messages with media and places.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">03<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Writers &amp; creators<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The voice block alone is the deliverable: drafts in their own register instead of assistant prose.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:36px 30px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">04<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Privacy-first users<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">People who want the benefit of a personal model and will not upload a decade of messages to get it.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Positioning\" data-screen-label=\"115\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Positioning against the alternatives.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;margin-top:4px\">\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:0 10px 18px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>APPROACH<\u002Fspan><span>WHO OWNS IT<\u002Fspan><span>OBJECTIVE<\u002Fspan><span>COVERAGE<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:28px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Platform recommender<\u002Fspan><span style=\"color:var(--mute)\">The platform<\u002Fspan><span style=\"color:var(--clay)\">Their revenue<\u002Fspan><span style=\"color:var(--mute)\">One platform's slice<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:28px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Ad-network profile<\u002Fspan><span style=\"color:var(--mute)\">A broker<\u002Fspan><span style=\"color:var(--clay)\">Ad yield<\u002Fspan><span style=\"color:var(--mute)\">Fragments, inferred<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:28px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Assistant chat memory<\u002Fspan><span style=\"color:var(--mute)\">The vendor<\u002Fspan><span style=\"color:var(--mute)\">Session continuity<\u002Fspan><span style=\"color:var(--mute)\">What you typed to it<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:28px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.4 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Note-taking / PKM tools<\u002Fspan><span style=\"color:var(--grn)\">You<\u002Fspan><span style=\"color:var(--mute)\">Recall of what you wrote down<\u002Fspan><span style=\"color:var(--mute)\">Only deliberate input<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:34px;padding:28px 10px;background:rgba(79,209,197,.07);font:400 var(--t-small)/1.4 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:600;color:var(--grn)\">personal-corpus<\u002Fspan><span style=\"color:var(--grn)\">You, locally<\u002Fspan><span style=\"color:var(--grn)\">Yours<\u002Fspan><span style=\"color:var(--grn)\">Sixteen sources, years deep, behavioral<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">The nearest comparable is a personal knowledge base, but PKM captures only what you chose to write down. This captures what you actually did.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Traction\" data-screen-label=\"116\" style=\"background:var(--grn-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:44px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Where it stands<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">v0.1 is shipped and smoke-tested.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:30px;margin-top:4px\">\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-stat)/0.9 'Cormorant Garamond',serif;color:var(--grn)\">16<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">source parsers, from iMessage to Netflix<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-stat)/0.9 'Cormorant Garamond',serif;color:var(--grn)\">5<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">skills covering the full pipeline<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-stat)/0.9 'Cormorant Garamond',serif;color:var(--grn)\">3<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">tables, the whole data model<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font:500 var(--t-stat)/0.9 'Cormorant Garamond',serif;color:var(--grn)\">0<\u002Fspan><span style=\"font:400 var(--t-small)/1.35 'DM Sans',sans-serif;color:var(--mute)\">bytes that leave the machine<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px;text-wrap:pretty\">Engine, skills, and docs are public under MIT, with a plugin manifest so the whole pipeline installs in one step.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Demo\" data-screen-label=\"117\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:28px;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:40px;flex:none;flex-shrink:0\">\n    <h2 style=\"margin:0;flex-shrink:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">What a user sees after the first ingest.<\u002Fh2>\n    <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)\">Live demo<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n    <div style=\"position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden\"><div style=\"position:absolute;inset:0;background:#120d18;padding:32px 36px;display:flex;flex-direction:column;gap:14px;font:400 var(--t-mono)/1.5 ui-monospace,Menlo,monospace;overflow:hidden\">\n      <div style=\"color:var(--mute)\">$ python engine/coverage.py<\u002Fdiv>\n      <div style=\"color:var(--grn)\">signal_in&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;24,880 · 5 src<\u002Fdiv>\n      <div style=\"color:var(--prp)\">communication&nbsp;78,410 · 4 src<\u002Fdiv>\n      <div style=\"color:var(--ink)\">published&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2,940 · 2 src<\u002Fdiv>\n      <div style=\"color:var(--mute)\">range&nbsp;&nbsp;2016-01 → 2026-08<\u002Fdiv>\n      <div style=\"border-top:1px solid var(--rule);padding-top:14px;color:var(--clay)\">thin&nbsp;&nbsp;work register<\u002Fdiv>\n      <div style=\"color:var(--clay)\">thin&nbsp;&nbsp;places &amp; travel<\u002Fdiv>\n      <div style=\"color:var(--tel)\">next best&nbsp;&nbsp;apple podcasts<\u002Fdiv>\n      <div style=\"margin-top:auto;color:rgba(245,240,232,.42)\">every claim downstream is scoped to this<\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n    <div style=\"position:relative;border:1px solid var(--rule);border-radius:16px;overflow:hidden\"><div style=\"position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:18px 26px;border-bottom:1px solid var(--rule);background:#120d18\">\n        <span style=\"width:11px;height:11px;border-radius:999px;background:var(--clay)\"><\u002Fspan>\n        <span style=\"width:11px;height:11px;border-radius:999px;background:var(--tel)\"><\u002Fspan>\n        <span style=\"width:11px;height:11px;border-radius:999px;background:var(--grn)\"><\u002Fspan>\n        <span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);margin-left:10px\">Signature-Profile.md<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:16px;overflow:hidden\">\n        <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn)\">## One-line read<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--ink)\">Publishes monthly on Substack and reads nine times more than gets written. 214 essays on a decade-stable interest spine.<\u002Fdiv>\n        <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">## Relationships<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">3 iMessage threads carry 58% of everything sent. Reader email answered in a day, friends in three.<\u002Fdiv>\n        <div style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">## Voice<\u002Fdiv>\n        <div style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Long and cadenced on Substack, clipped and lowercase in iMessage. Semicolons in one, none in the other.<\u002Fdiv>\n        <div style=\"margin-top:auto;border-top:1px solid var(--rule);padding-top:16px;font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--clay)\">Caveat: work register pending, no work chat exported.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Coverage tells you what you have and what's thin. The profile is generated from exactly that, with the caveats stated up top.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Distribution\" data-screen-label=\"118\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">Distribution<\u002Fdiv>\n    <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">The skills are the install.<\u002Fh2>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);text-wrap:pretty\">A plugin manifest ships the whole pipeline as one installable unit, so a user goes from \"I'd like to own my data\" to a fired export request inside a single conversation.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute)\">There is nothing to host, no account to create, and no onboarding funnel to maintain.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">.claude-plugin/<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">plugin.json and marketplace.json, installable in one step<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">skills.yaml<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Machine-readable skill registry other tools can parse<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:32px 34px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.06em\">engine/<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Plain Python with no service dependency, runs anywhere Python does<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The moat\" data-screen-label=\"119\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">Defensibility<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">The schema is easy to copy. The judgment took the time.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:36px;margin-top:10px\">\n    <div style=\"border-top:1px solid var(--prule);padding-top:26px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Export-UI knowledge<\u002Fspan><span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--pmute)\">Which toggle silently bloats an archive by 40GB. Which screen has four separate \"Clear all\" buttons. This is only learned by getting it wrong.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:26px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Operational invariants<\u002Fspan><span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--pmute)\">Immutable chat.db reads, attributedBody decoding, shrink-guarded writes, no SQLite on network mounts. Each one is a bug someone already paid for.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid var(--prule);padding-top:26px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Honest-analysis method<\u002Fspan><span style=\"font:400 var(--t-small)/1.5 'DM Sans',sans-serif;color:var(--pmute)\">Cite the query, lead with the counter-reading, flag thin slices, end with a falsifiable test. It's what separates a profile from a horoscope.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1500px;text-wrap:pretty\">Encoded as skills rather than code, so it improves by being argued with.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Privacy as architecture\" data-screen-label=\"120\" style=\"background:var(--clay-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--clay)\">Privacy &amp; safety<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">Privacy is the architecture, not the policy page.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px 44px;margin-top:6px\">\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">No server exists to breach<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">There is no backend, no account, and no telemetry. corpus.db is git-ignored and local.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Credentials never touched<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">The agent drives export UIs up to the auth step and hands password and 2FA to the user. Hard rule.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Read-only on the mailbox<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Collect never sends, deletes, or changes settings, and treats every emailed link as untrusted.<\u002Fspan><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(217,112,102,.35);padding-top:24px;display:flex;flex-direction:column;gap:10px\"><span style=\"font:500 var(--t-body)/1.25 'DM Sans',sans-serif\">Sensitive output stays filed<\u002Fspan><span style=\"font:400 var(--t-small)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Relationship, health, and psychological analyses live in a marked local folder, out of cross-session memory.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-body)/1.45 'DM Sans',sans-serif;color:var(--mute);max-width:1500px\">This is also the product argument: the same guarantees are why a user will hand over a decade of messages at all.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Ecosystem\" data-screen-label=\"121\" style=\"background:var(--prp-bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--prp)\">Ecosystem<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif;max-width:1450px\">The first consumer is already built: Mirror Palace.<\u002Fh2>\n  <p style=\"margin:0;font:400 var(--t-lead)/1.4 'DM Sans',sans-serif;color:var(--mute);max-width:1500px;text-wrap:pretty\">A cognitive-framework toolkit, 49 frameworks, ten life domains, six agent archetypes, that teaches an agent how a person works. It has always needed evidence. This is the evidence layer.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center;margin-top:8px\">\n    <div style=\"background:rgba(79,209,197,.12);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--grn)\">personal-corpus<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">What happened, structured, deduped, timestamped, cited.<\u002Fspan><\u002Fdiv>\n    <div style=\"font:600 var(--t-title)/1 ui-monospace,Menlo,monospace;color:var(--prp)\">→<\u002Fdiv>\n    <div style=\"background:rgba(246,135,179,.16);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:38px 34px;display:flex;flex-direction:column;gap:14px\"><span style=\"font:600 var(--t-lead)/1.15 'Cormorant Garamond',serif;color:var(--prp)\">Mirror Palace<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">What it means, pattern reads, domain status, decisions, agent briefings.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:0;font:400 var(--t-mono)/1.4 ui-monospace,Menlo,monospace;color:var(--mute)\"><a href=\"https://github.com/TaylorONeal/mirror-palace\">github.com/TaylorONeal/mirror-palace<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Roadmap\" data-screen-label=\"122\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--tel)\">Roadmap<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Next, in order.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:22px;margin-top:6px\">\n    <div style=\"display:grid;grid-template-columns:220px 1fr;gap:44px;align-items:baseline;border-top:1px solid var(--rule);padding-top:24px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.08em\">SHIPPED<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">Engine, five skills, sixteen parsers, coverage reporting, delta ingest<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:220px 1fr;gap:44px;align-items:baseline;border-top:1px solid var(--rule);padding-top:24px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">NEXT<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">A first-class Reddit parser, the GDPR CSVs already load through the generic kind<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:220px 1fr;gap:44px;align-items:baseline;border-top:1px solid var(--rule);padding-top:24px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">NEXT<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">corpus-merge, unify one contact across platforms, which unlocks real relationship analysis<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:220px 1fr;gap:44px;align-items:baseline;border-top:1px solid var(--rule);padding-top:24px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.08em\">NEXT<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--ink)\">A richer Content Profile module, taste clustering beyond top-N counting<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:220px 1fr;gap:44px;align-items:baseline;border-top:1px solid var(--rule);padding-top:24px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--mute);letter-spacing:.08em\">LATER<\u002Fspan><span style=\"font:400 var(--t-body)/1.4 'DM Sans',sans-serif;color:var(--mute)\">More first-class sources, TikTok, LinkedIn, Strava, Kindle, each one function against the Item contract<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Risks\" data-screen-label=\"123\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:30px;font-family:'DM Sans',system-ui,sans-serif\">\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Risks, and what absorbs them.<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;margin-top:4px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:44px;padding:0 10px 18px;border-bottom:2px solid var(--rule);font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:var(--mute)\"><span>RISK<\u002Fspan><span>MITIGATION<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:44px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.45 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Export UIs change constantly<\u002Fspan><span style=\"color:var(--mute)\">The fragile knowledge lives in skills, not code, a UI change is a text edit, and the parsers are downstream of the file format, which moves far more slowly.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:44px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.45 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Setup friction is real<\u002Fspan><span style=\"color:var(--mute)\">Exports take up to a day. Acquire fires them all in parallel and collect watches the inbox, so the wait is unattended rather than abandoned.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:44px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.45 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Users won't have every source<\u002Fspan><span style=\"color:var(--mute)\">Partial coverage is a design guarantee, not a degraded mode. Coverage scopes every claim, and names the next-best source to add.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:44px;padding:26px 10px;border-bottom:1px solid var(--rule);font:400 var(--t-small)/1.45 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">Self-analysis can go badly<\u002Fspan><span style=\"color:var(--mute)\">Analysis is bounded by explicit guardrails: hypotheses not verdicts, counter-readings first, no over-pathologizing, sensitive output kept local.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1.3fr;gap:44px;padding:26px 10px;font:400 var(--t-small)/1.45 'DM Sans',sans-serif;align-items:baseline\"><span style=\"font-weight:500\">A platform could ship this natively<\u002Fspan><span style=\"color:var(--mute)\">They can only ship their own slice, aimed at their own objective. Cross-platform and user-owned is the part they structurally cannot do.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The ask\" data-screen-label=\"124\" style=\"background:var(--bg);color:var(--ink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;gap:var(--g-title);font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--grn)\">The ask<\u002Fdiv>\n  <h2 style=\"margin:0;font:600 var(--t-title)/1.06 'Cormorant Garamond',serif\">Three things move this forward.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:8px\">\n    <div style=\"background:var(--grn-bg);border:1px solid rgba(79,209,197,.4);border-radius:16px;padding:42px 36px;display:flex;flex-direction:column;gap:18px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--grn);letter-spacing:.1em\">01 PARSERS<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Bring a source<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">One generator against the Item contract adds a platform. The obvious gaps are TikTok, LinkedIn, Strava, and Kindle.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--tel-bg);border:1px solid rgba(212,165,116,.45);border-radius:16px;padding:42px 36px;display:flex;flex-direction:column;gap:18px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--tel);letter-spacing:.1em\">02 FIRST RUNS<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Run it on your own data<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">Every real corpus surfaces an export trap or an encoding edge case that no amount of reading finds.<\u002Fspan><\u002Fdiv>\n    <div style=\"background:var(--prp-bg);border:1px solid rgba(246,135,179,.45);border-radius:16px;padding:42px 36px;display:flex;flex-direction:column;gap:18px\"><span style=\"font:500 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--prp);letter-spacing:.1em\">03 DOWNSTREAM<\u002Fspan><span style=\"font:500 var(--t-lead)/1.2 'DM Sans',sans-serif\">Build on the substrate<\u002Fspan><span style=\"font:400 var(--t-small)/1.45 'DM Sans',sans-serif;color:var(--mute)\">A recommender, a journal agent, a write-as-me drafter. The substrate is proved by what reads from it.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Closing\" data-screen-label=\"125\" style=\"background:var(--paper);color:var(--pink);padding:var(--pt) var(--px) var(--pb);display:flex;flex-direction:column;justify-content:space-between;font-family:'DM Sans',system-ui,sans-serif\">\n  <div style=\"font:600 var(--t-mono)/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--pmute)\">personal-corpus<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:34px\">\n    <p style=\"margin:0;font:500 var(--t-hero)/1.05 'Cormorant Garamond',serif;letter-spacing:-.02em;max-width:1550px\">The model of you already exists. Someone should build the one that answers to you.<\u002Fp>\n    <p style=\"margin:0;font:400 var(--t-lead)/1.45 'DM Sans',sans-serif;color:var(--pmute);max-width:1400px;text-wrap:pretty\">Local, first-party, MIT, and shipping. Fork it, run it, or point your own agent at it.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid var(--prule);padding-top:30px;display:flex;justify-content:space-between;font:400 var(--t-mono)/1 ui-monospace,Menlo,monospace;color:var(--pmute)\">\n    <span>github.com/TaylorONeal/personal-signature<\u002Fspan>\n    <span>github.com/TaylorONeal/mirror-palace<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
