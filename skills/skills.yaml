# skills.yaml
#
# Machine-readable manifest of the personal-corpus skills.
#
# Each skill carries two sets of information, kept separate because they
# serve separate purposes:
#
#   when_to_use:  the trigger description. This is what an AI assistant (or a
#                 person skimming) reads to decide WHETHER to invoke the skill.
#                 It mirrors the `description` field in each skill's SKILL.md
#                 frontmatter.
#
#   description:  the detailed description. This is WHAT the skill does once
#                 invoked: its goal, workflow, settings, and guardrails,
#                 condensed from the body of its SKILL.md.
#
# The authoritative working instructions remain in each skill's SKILL.md at
# the listed path. skills/README.md presents this same information in a
# human-readable form.

pipeline:
  summary: "acquire -> collect -> ingest -> profile/analyze"
  order:
    - corpus-acquire
    - corpus-collect
    - corpus-ingest
    - corpus-profile
    - corpus-analyze

skills:
  - name: corpus-acquire
    stage: "1a. Request"
    path: skills/corpus-acquire/SKILL.md
    when_to_use: >-
      Requests personal-data exports from each platform the user has (Google
      Takeout, Instagram, Facebook, X/Twitter, Reddit, Slack, Spotify) and
      copies local sources (iMessage, browser bookmarks). Use when the user
      wants to pull their data, request their exports, get their
      Instagram/Gmail/YouTube data, or start building a personal corpus.
      Drives each export UI with the exact settings that keep exports small
      and parseable, avoids the traps that silently bloat them, and hands
      password/2FA steps to the user.
    description: >-
      Stage 1a of the pipeline. Gets the user's data OUT of each platform and
      onto disk, configured so it is small and parseable. Confirms an exports/
      folder and an identity.json (copied from identity.example.json) exist
      before starting, so parsers later know which handles are the user's.
      Carries a per-source playbook with the exact export settings and the
      traps that silently bloat archives: for Google Takeout
      (takeout.google.com/settings/takeout) it keeps products separate and,
      for Gmail Sent, turns OFF the "Include all messages in Mail" default and
      ticks only the "Sent" label; for Instagram DMs and Facebook Messenger it
      clears EVERY customize section (each has its own "Clear all") and
      selects Messages only, JSON format, All time, lower media quality; for
      X/Twitter it requests the full archive (takes ~24h, one per handle); for
      Reddit it uses the GDPR export at reddit.com/settings/data-request; for
      Slack it uses a workspace or per-DM export; for Spotify it prefers
      exportify for an instant CSV. Local sources need no request: copy
      iMessage's ~/Library/Messages/chat.db and a browser-bookmarks HTML
      export into exports/. Hard rule: never enters the user's password, 2FA
      code, or payment info; it drives the UI up to the auth step and hands
      off. Exports generate asynchronously (minutes to ~24h), so it fires them
      all up front, tells the user each rough ETA, and records what was
      requested in exports/_manifest.json so corpus-collect knows what to
      watch for. Partial coverage is fine; the rest of the pipeline adapts.

  - name: corpus-collect
    stage: "1b. Collect"
    path: skills/corpus-collect/SKILL.md
    when_to_use: >-
      Watches the user's email for export-ready notifications from Google,
      Meta/Instagram/Facebook, X, Reddit, Spotify, and Slack, then helps
      download each archive into the exports/ folder and tracks what is still
      pending. Use when the user asks whether their exports are ready, wants
      to collect their data, asks if their Takeout finished, or wants a
      recurring check. Best run on a schedule (e.g. daily) after
      corpus-acquire fires the requests. Requires an email connector (e.g.
      Gmail) and runs locally.
    description: >-
      Stage 1b of the pipeline: the bridge between corpus-acquire and
      corpus-ingest, and the stage that keeps running after the first build.
      Turns "I requested exports" into "the files are on disk" without the
      user babysitting their inbox. Workflow: scan the connected mailbox for
      export-ready notifications (Google from noreply-dmrc@google.com with
      subject "Your Google data is ready"; Meta from
      security@facebookmail.com with "Your information is ready to download";
      X "Your X data is ready"; Reddit "Your Reddit data request";
      Spotify/Slack "your data" / "export"); surface what is ready with
      platform, date, and download link, verifying the link domain matches
      the platform and treating email links as untrusted; help download each
      archive, preferring to hand the user the link or driving the browser
      with the user present for auth, never entering passwords or 2FA;
      file each archive into the correct subfolder (exports/instagram/,
      exports/google_voice/, exports/twitter/, etc.), leaving archives
      zipped; update exports/_manifest.json with what has arrived and what is
      still pending; and hand off to corpus-ingest when a new archive lands,
      using --mode delta for sources already in the corpus. On scheduled runs
      (daily is usually right) it reports only NEW arrivals, stays silent on
      no-ops, nudges about anything pending past its expected ETA, and flags
      urgently when a download link is about to lapse (links typically expire
      in ~4 days). Boundaries: read-only on email (never send, delete, or
      change settings); downloading a file requires explicit user
      confirmation of filename, source, and size; if a link or sender domain
      looks off, stop and ask.

  - name: corpus-ingest
    stage: "2. Ingest"
    path: skills/corpus-ingest/SKILL.md
    when_to_use: >-
      Parses whatever export files are present in exports/ and loads them into
      the unified local corpus database. Use when the user has dropped data
      exports in the exports/ folder and wants to ingest, load their data, or
      build the corpus, or after corpus-collect files a new archive.
      Auto-detects file types, routes each to the right parser, dedupes on
      re-runs, supports delta mode for ongoing scans, and prints a coverage
      report. Tolerant of missing sources: runs on whatever exists.
    description: >-
      Stage 2 of the pipeline. Gets the files in exports/ into corpus.db
      cleanly, idempotently, and partial-source-tolerant; re-running is
      always safe because content/external-id hashing dedupes. The engine
      lives in engine/; the DB defaults to corpus.db at the project root with
      identity from identity.json. Detect: maps each file or folder to a
      parser kind, covering imessage (chat.db), mbox (Gmail Sent), gmailjson
      (Gmail API threads JSON), instagram, facebook, twitter
      (data/tweets.js), googlechat, googlevoice (Voice/Calls/*.html),
      whatsapp (_chat.txt), whatsapp_ios (ChatStorage.sqlite), slack,
      bookmarks (*.html), netflix, yelp, plus generic csv and jsonl kinds
      that take --source/--bucket/--direction/--map for any tabular export
      (Spotify, Goodreads, Reddit CSVs). Ingest: initial runs use one command
      per source, "python engine/run_ingest.py <kind> <path> --me
      <identity>", with --dedupe-against imessage for SMS-overlapping sources
      such as Google Voice; ongoing scans re-run with --mode delta, which
      scans supplied records, skipping known IDs while retaining late arrivals. Report:
      "python engine/coverage.py" shows what is in the corpus, which
      dimensions are thin, and which source would add the most next; shown
      after every ingest. Critical operational notes: back up before any bulk
      run (cp corpus.db corpus.db.bak-$(date +%F-%H%M)); the engine refuses
      to overwrite the store with a DB under 90% of its original item count and fails loudly
      on a bad copy; stores require atomic rename and exclusive creation,
      and unsupported mounts fail closed; extract only what is needed from
      big zips; read a consistent iMessage backup in read-only mode and decode attributedBody on modern macOS.
      Adding a source is one generator yielding the Item contract (bucket,
      source, direction required) handed to Corpus.ingest; keep raw exports
      forever as the backup of last resort.

  - name: corpus-profile
    stage: "3. Profile"
    path: skills/corpus-profile/SKILL.md
    when_to_use: >-
      Builds a one-page signature profile from the corpus: who the person is,
      how they write (a drop-in voice block), what they're into, their key
      relationships, and trends over time. Use when the user wants a profile,
      signature, voice signature, summary of themselves, or asks what their
      data says about them. Fast and repeatable; coverage-aware: states
      what's thin and never invents what isn't there.
    description: >-
      Stage 3 of the pipeline. Produces a tight, honest, one-page synthesis
      the user can actually use, plus a voice block they can paste into
      prompts; deterministic where possible, with every claim tracing to a
      query, not a vibe. Run order: coverage first ("python
      engine/coverage.py"), noting thin or missing dimensions up top so
      nothing reads as more complete than it is; then pull structured facts
      by querying the DB: identity arc (cities and time spans, life
      chapters), volume and trends (v_monthly_volume, peaks and dips by year
      and bucket), relationships (v_top_contacts, sent:received ratio, who
      initiates, durable vs ended bonds), interests (top domains and keywords
      from bookmarks, genres and mood from music, categories from reviews
      and orders, watch and search themes), and voice (per-register samples
      of the user's OWN words by context, starting from "python
      engine/query.py voice-sample"). Writes two artifacts:
      private/Signature-Profile.md, a one-page profile with a one-line read,
      who-they-are-in-the-data, trends, relationships, voice summary, and
      coverage caveats, with non-obvious findings marked explicitly; and
      private/voice-signature.md, a drop-in system-prompt block ("Write as <name>:
      ...") plus a register map, tics and tells, do/don't, and light stats,
      with every trait backed by a verbatim line from the corpus. Principles:
      coverage-aware (scope claims to the sources present), non-obvious over
      generic (surface cross-source patterns, not horoscope filler), honest
      (a missing register is "pending", never fabricated), private (outputs
      stay local; no personal/relationship/health detail in cross-session
      memory), and repeatable (re-run when new sources land, noting what
      changed).

  - name: corpus-analyze
    stage: "4. Analyze"
    path: skills/corpus-analyze/SKILL.md
    when_to_use: >-
      Runs a deep, on-demand analysis over the corpus: communication
      patterns, relationship dynamics, interest evolution, life timeline, or
      open-ended what's-non-obvious-about-me. Use when the user wants to go
      deeper, analyze their relationships/communication/interests, find
      patterns, or asks a specific question of their data. Heavier and more
      generative than corpus-profile; every claim is cited to a query, and it
      is honest about what the data can't show.
    description: >-
      Stage 4 of the pipeline. Answers a real question of the data with
      rigor, not flattery: state the pattern, show the numbers, give the
      strongest alternative reading, and name what would confirm or kill it.
      Modules (pick what the user asks for): communication patterns
      (per-relationship sent:received ratio, initiation rate via gap-based
      session starts, message-length asymmetry, late-night share, response
      cadence, with comparisons across relationship types where inversions
      are the real findings); relationship dynamics (the arc of a specific
      bond over time: volume, who-leads drift, how it started and ended,
      patterns only unless the user asks for specifics); interest evolution
      (how themes shift across years in bookmarks, music, reviews, and
      history; formative layers vs current); timeline / life chapters
      (cross-source events by period and the rhythm underneath); and
      open-ended "non-obvious" scans for cross-source agreements and
      contradictions. Method for every module: compute, don't intuit (write
      the query, get the numbers, cite them inline); state the pattern
      plainly, then lead with the strongest counter-reading; caveat the data
      (sample size, missing directions or sources, eras not captured); and
      end with a falsifiable next step, one concrete experiment or query.
      Guardrails: don't over-pathologize; separate description from
      prescription; name patterns as hypotheses about behavior, not verdicts
      about the person; keep sensitive analyses in a local, clearly-marked
      folder and never persist them to cross-session memory; no specifics or
      names in pattern write-ups unless the user explicitly asks; and if the
      data can't answer the question, say so: "not enough signal" is a valid
      result.
